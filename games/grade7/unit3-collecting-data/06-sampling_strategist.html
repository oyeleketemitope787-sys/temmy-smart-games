<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Temmy Smart Games — Grade 7 Sampling Strategist</title>
<style>
:root{--blue:#153B7A;--gold:#C99700;--purple:#6B46C1;--ink:#172033;--soft:#f5f7fc;--green:#18864b;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef3ff,#fff9e8);color:var(--ink)}
.app{max-width:1000px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 30px #153b7a22}
.badge{display:inline-block;background:#ffffff22;border:1px solid #ffffff55;border-radius:30px;padding:7px 13px;font-weight:700;font-size:13px}h1{margin:10px 0 4px;font-size:30px}.subtitle{opacity:.92}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{background:#fff;border-radius:15px;padding:12px;text-align:center;box-shadow:0 5px 18px #153b7a12}.stat b{display:block;color:var(--blue);font-size:22px}
.card{background:#fff;border-radius:22px;padding:24px;margin-top:14px;box-shadow:0 8px 28px #153b7a15}.round{color:var(--purple);font-weight:800}.scenario{font-size:21px;font-weight:800;line-height:1.4;margin:12px 0 18px}
.question{background:var(--soft);border-left:5px solid var(--gold);padding:17px;border-radius:12px;margin-bottom:18px}.options{display:grid;gap:12px}
.opt{border:2px solid #dce2ef;background:#fff;border-radius:14px;padding:15px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;transition:.18s}.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--purple);background:#faf8ff}.opt.wrong{border-color:var(--red);background:#fff0ee;color:var(--red)}.opt.correct{border-color:var(--green);background:#eaf8f0;color:var(--green)}.opt:disabled{cursor:default}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.hint{background:#fff6d8;color:#765900}.next{background:var(--blue);color:#fff}.next:disabled{opacity:.35;cursor:not-allowed}
.feedback{margin-top:16px;padding:15px;border-radius:13px;display:none;line-height:1.5}.feedback.good{display:block;background:#eaf8f0;border:1px solid #9ed7b8}.feedback.bad{display:block;background:#fff0ee;border:1px solid #efaaa3}
.hintbox{display:none;margin-top:12px;background:#f2efff;border:1px solid #cfc2f5;padding:13px;border-radius:12px}.progress{height:9px;background:#e8ebf3;border-radius:10px;overflow:hidden;margin-top:15px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--purple));transition:.3s}.footer{text-align:center;padding:18px;color:#687084;font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.scenario{font-size:19px}.card{padding:17px}}
</style>
</head>
<body><div class="app">
<div class="top"><span class="badge">GRADE 7 • UNIT 3 • GAME 6</span><h1>👥 Sampling Strategist</h1><div class="subtitle">Choose a sensible sample and reason about population, fairness and random sampling.</div></div>
<div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Streak<b id="streak">0</b></div><div class="stat">Accuracy<b id="accuracy">0%</b></div><div class="stat">Case<b id="caseNo">1/10</b></div></div>
<div class="card"><div class="round" id="round">CASE 1</div><div class="scenario" id="scenario"></div><div class="question"><strong>Strategist question:</strong><br><span id="prompt"></span></div>
<div class="options" id="options"></div><div class="controls"><button class="btn hint" id="hint">💡 Hint</button><button class="btn next" id="next" disabled>Next Case →</button></div>
<div class="hintbox" id="hintbox"></div><div class="feedback" id="feedback"></div><div class="progress"><div class="bar" id="bar"></div></div></div>
<div class="footer">TEMMY SMART GAMES • Interactive Mathematics • Learn • Play • Think • Achieve</div></div>
<script>
const cases=[
{scenario:"A school wants to find out what its students think about the school library.",prompt:"Which is the best description of the population?",options:["All students in the school","20 students chosen from Grade 7","Students who visit the library","The teachers who manage the library"],ans:"All students in the school",why:"The population is the whole group the investigation is about.",hint:"Ask: “Who do we want the conclusion to describe?”"},
{scenario:"A school has 600 students and wants to ask 60 students about their favourite school activity.",prompt:"What is the sample?",options:["All 600 students","The 60 students asked","Only Grade 7 students","The favourite activities"],ans:"The 60 students asked",why:"The sample is the smaller group selected from the population to provide data.",hint:"The sample is the group actually selected to answer the question."},
{scenario:"A school wants to know the favourite sport of all 800 students.",prompt:"Which sampling plan is most likely to give a fair sample?",options:["Choose 50 students randomly from the school list","Ask only students in the football club","Ask the first 50 students entering school","Ask only students who volunteer"],ans:"Choose 50 students randomly from the school list",why:"Random selection gives students across the population a chance to be selected and avoids choosing only one particular group.",hint:"Look for a method that does not deliberately select a particular type of student."},
{scenario:"A school wants opinions about a new timetable. The researcher asks only students who said they already like the timetable.",prompt:"What is the main sampling problem?",options:["The sample may not represent the whole population","The population is too large","The sample contains too many different ages","Random sampling is impossible"],ans:"The sample may not represent the whole population",why:"Students who already like the timetable may have different opinions from the wider student population.",hint:"Think about whose opinions are missing."},
{scenario:"A town has 2,000 students in its schools. A researcher wants to estimate how many students cycle to school.",prompt:"Why might a sample be used instead of asking every student?",options:["It can collect information from a manageable group","A sample always gives exactly the same result as a census","Only cyclists can be included","A sample removes the need for a question"],ans:"It can collect information from a manageable group",why:"A sample can make data collection practical when the population is large.",hint:"Think about time and effort."},
{scenario:"A school has 500 students. A researcher chooses 10 students from one friendship group and uses their answers to describe the whole school.",prompt:"What should the researcher be concerned about?",options:["The sample may not be representative","The population has disappeared","The questionnaire must have no questions","The sample is automatically random"],ans:"The sample may not be representative",why:"One friendship group may have views or habits that differ from the wider school population.",hint:"Does one friendship group necessarily reflect the whole school?"},
{scenario:"A researcher writes every student's name on a list, gives each name a number, and uses a random method to select 40 names.",prompt:"What type of sampling is being described?",options:["Random sampling","Convenience sampling","Choosing friends","Self-selection"],ans:"Random sampling",why:"Students are selected using a random process from the population list.",hint:"The key clue is that the names are selected randomly."},
{scenario:"A school wants to compare sports participation between boys and girls. It selects students from both groups rather than choosing only one group.",prompt:"Why is including both groups important?",options:["It helps the sample reflect the groups being compared","It guarantees every answer will be the same","It means no sample is needed","It makes the population smaller"],ans:"It helps the sample reflect the groups being compared",why:"If the investigation compares groups, the sample should include the relevant groups so their data can be examined.",hint:"Which groups are part of the question?"},
{scenario:"Two samples are proposed for a school survey. Sample A: 5 students from one class. Sample B: 50 students selected randomly from across the school.",prompt:"Which statement is most appropriate?",options:["Sample B is more likely to represent the school population","Sample A must represent the whole school","Both samples are guaranteed to be identical","Sample size never matters"],ans:"Sample B is more likely to represent the school population",why:"A larger random sample drawn across the population generally gives broader coverage than five students from one class.",hint:"Consider both coverage and selection."},
{scenario:"A researcher wants to know the opinions of all students about school lunch.",prompt:"Which plan is the most appropriate?",options:["Define the student population, choose a fair sample, then collect their opinions","Ask only students eating lunch at one table","Ask only students who strongly support the lunch menu","Choose friends because they are easy to contact"],ans:"Define the student population, choose a fair sample, then collect their opinions",why:"A sound investigation starts by identifying the population and selecting a sample that can reasonably represent it.",hint:"Think about population → sample → data."}
];
let score=0,streak=0,attempts=0,correct=0,current=0,solved=false;
const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function render(){solved=false;const c=cases[current];$("round").textContent=`CASE ${current+1}`;$("caseNo").textContent=`${current+1}/10`;$("scenario").textContent=c.scenario;$("prompt").textContent=c.prompt;$("feedback").style.display="none";$("feedback").className="feedback";$("hintbox").style.display="none";$("next").disabled=true;$("bar").style.width=`${current/10*100}%`;$("options").innerHTML="";shuffle(c.options).forEach(label=>{const b=document.createElement("button");b.className="opt";b.textContent=label;b.addEventListener("click",()=>answer(b,label));$("options").appendChild(b)});$("hint").onclick=()=>{$("hintbox").textContent=c.hint;$("hintbox").style.display="block"}}
function answer(btn,label){if(solved)return;attempts++;if(label===cases[current].ans){solved=true;correct++;score+=100;streak++;btn.classList.add("correct");[...$("options").children].forEach(x=>x.disabled=true);$("feedback").className="feedback good";$("feedback").style.display="block";$("feedback").innerHTML=`<strong>✓ Strategic choice!</strong><br>${cases[current].why}`;$("next").disabled=false}else{streak=0;btn.classList.add("wrong");btn.disabled=true;$("feedback").className="feedback bad";$("feedback").style.display="block";$("feedback").innerHTML="<strong>Not quite.</strong> Examine the population, sample and selection method, then try again."}update()}
function update(){$("score").textContent=score;$("streak").textContent=streak;$("accuracy").textContent=attempts?Math.round(correct/attempts*100)+"%":"0%"}
$("next").addEventListener("click",()=>{if(current<cases.length-1){current++;render()}else finish()});
function finish(){$("bar").style.width="100%";$("round").textContent="🏆 SAMPLING MISSION COMPLETE";$("scenario").textContent="You completed Sampling Strategist.";$("prompt").textContent="Review your result and replay to strengthen your sampling decisions.";$("options").innerHTML="";$("feedback").className="feedback good";$("feedback").style.display="block";$("feedback").innerHTML=`<strong>${correct===10?"PERFECT SAMPLING STRATEGIST!":"Well investigated!"}</strong><br>Cases solved: ${correct}/10 • Final score: ${score}`;$("next").textContent="↻ Play Again";$("next").disabled=false;$("next").onclick=()=>{score=0;streak=0;attempts=0;correct=0;current=0;update();$("next").textContent="Next Case →";$("next").onclick=null;render()}}
render();update();
</script></body></html>

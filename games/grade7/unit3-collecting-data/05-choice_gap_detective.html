<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temmy Smart Games — Grade 7 Choice Gap Detective</title>
<style>
:root{--blue:#153B7A;--gold:#C99700;--purple:#6B46C1;--ink:#172033;--soft:#f5f7fc;--green:#18864b;--red:#c0392b}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef3ff,#fff9e8);color:var(--ink)}
.app{max-width:1000px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 30px #153b7a22}
.badge{display:inline-block;background:#ffffff22;border:1px solid #ffffff55;border-radius:30px;padding:7px 13px;font-weight:700;font-size:13px}
h1{margin:10px 0 4px;font-size:30px}.subtitle{opacity:.92}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{background:white;border-radius:15px;padding:12px;text-align:center;box-shadow:0 5px 18px #153b7a12}.stat b{display:block;color:var(--blue);font-size:22px}
.card{background:white;border-radius:22px;padding:24px;margin-top:14px;box-shadow:0 8px 28px #153b7a15}.round{color:var(--purple);font-weight:800}.scenario{font-size:22px;font-weight:800;line-height:1.35;margin:12px 0 20px}
.question{background:var(--soft);border-left:5px solid var(--gold);padding:17px;border-radius:12px;margin-bottom:18px}
.options{display:grid;gap:12px}.opt{border:2px solid #dce2ef;background:white;border-radius:14px;padding:15px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;transition:.18s}.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--purple);background:#faf8ff}.opt.wrong{border-color:var(--red);background:#fff0ee;color:var(--red)}.opt.correct{border-color:var(--green);background:#eaf8f0;color:var(--green)}.opt:disabled{cursor:default}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.hint{background:#fff6d8;color:#765900}.next{background:var(--blue);color:white}.next:disabled{opacity:.35;cursor:not-allowed}
.feedback{margin-top:16px;padding:15px;border-radius:13px;display:none;line-height:1.5}.feedback.good{display:block;background:#eaf8f0;border:1px solid #9ed7b8}.feedback.bad{display:block;background:#fff0ee;border:1px solid #efaaa3}
.hintbox{display:none;margin-top:12px;background:#f2efff;border:1px solid #cfc2f5;padding:13px;border-radius:12px}
.progress{height:9px;background:#e8ebf3;border-radius:10px;overflow:hidden;margin-top:15px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--purple));transition:.3s}
.footer{text-align:center;padding:18px;color:#687084;font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.scenario{font-size:19px}.card{padding:17px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="badge">GRADE 7 • UNIT 3 • GAME 5</span>
    <h1>🕳️ Choice Gap Detective</h1>
    <div class="subtitle">Spot missing, overlapping or unsuitable questionnaire answer choices.</div>
  </div>

  <div class="stats">
    <div class="stat">Score<b id="score">0</b></div>
    <div class="stat">Streak<b id="streak">0</b></div>
    <div class="stat">Accuracy<b id="accuracy">0%</b></div>
    <div class="stat">Case<b id="caseNo">1/10</b></div>
  </div>

  <div class="card">
    <div class="round" id="roundLabel">CASE 1</div>
    <div class="scenario" id="scenario"></div>
    <div class="question"><strong>Detective question:</strong><br><span id="prompt"></span></div>
    <div class="options" id="options"></div>

    <div class="controls">
      <button class="btn hint" id="hintBtn">💡 Hint</button>
      <button class="btn next" id="nextBtn" disabled>Next Case →</button>
    </div>
    <div class="hintbox" id="hintBox"></div>
    <div class="feedback" id="feedback"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="footer">TEMMY SMART GAMES • Interactive Mathematics • Learn • Play • Think • Achieve</div>
</div>

<script>
const cases = [
 {scenario:"A school asks: “How many films did you watch last month?”", choices:["0","1–2","3–5"], task:"What is the main problem with these answer choices?", ans:"Incomplete", why:"The choices do not include every possible response. For example, a learner who watched 6 films has no suitable choice.", hint:"Think about a student who watched more than 5 films."},
 {scenario:"A questionnaire asks: “How many books did you read this term?”", choices:["0","1–2","3–5","6–10","More than 10"], task:"How should these choices be judged?", ans:"Complete and suitable", why:"The ranges cover zero through more than ten without leaving an obvious gap.", hint:"Check whether a student can find a choice for any whole-number answer."},
 {scenario:"A questionnaire asks: “How many siblings do you have?”", choices:["1","2","3","4"], task:"What is the main problem with these choices?", ans:"Incomplete", why:"A student with 0 siblings or more than 4 siblings has no suitable choice.", hint:"Check the smallest and largest possible responses."},
 {scenario:"A questionnaire asks: “How many books did you read?”", choices:["1–5","5–10","10–15"], task:"What is the problem with these ranges?", ans:"Overlapping choices", why:"The value 5 appears in both 1–5 and 5–10, while 10 appears in both 5–10 and 10–15. A response should fit one clear category.", hint:"Look carefully at the boundary numbers."},
 {scenario:"A sports questionnaire asks: “How many hours do you play sport each week?”", choices:["0","1–2","3–5","6–10","More than 10"], task:"How should these choices be judged?", ans:"Complete and suitable", why:"The choices cover zero, grouped values, and values above ten without overlap.", hint:"Check for gaps and overlaps."},
 {scenario:"A survey asks: “How many pets do you have?”", choices:["0","1","2","3","4 or more"], task:"How should these choices be judged?", ans:"Complete and suitable", why:"Every whole-number response has a category: 0, 1, 2, 3, or 4 and above.", hint:"Consider what happens when someone has many pets."},
 {scenario:"A questionnaire asks: “How many hours did you study yesterday?”", choices:["0–2","2–4","4–6","6–8"], task:"What is the problem with these choices?", ans:"Overlapping choices", why:"The boundary values 2, 4 and 6 occur in two ranges, making some answers fit more than one choice.", hint:"Test the exact boundary numbers."},
 {scenario:"A school survey asks: “How many times did you visit the library this month?”", choices:["0","1–3","4–6","7–9"], task:"What is the main problem with these choices?", ans:"Incomplete", why:"There is no category for 10 or more visits, so the choices do not cover all possible responses.", hint:"Imagine a student who visited 10 times."},
 {scenario:"A questionnaire asks: “How many minutes do you read each day?”", choices:["0–15","16–30","31–45","46–60","More than 60"], task:"How should these choices be judged?", ans:"Complete and suitable", why:"The ranges are ordered, cover the possible values, and do not share boundary values.", hint:"Check both coverage and overlap."},
 {scenario:"A class survey asks: “How many people live in your home?”", choices:["1–3","4–6","7–9"], task:"What is the main problem with these choices?", ans:"Incomplete", why:"The choices do not include homes with 10 or more people. A suitable questionnaire should provide a response for them.", hint:"Look beyond the final category."}
];

const labels=["Incomplete","Overlapping choices","Complete and suitable","Other problem"];
let score=0, streak=0, attempts=0, correct=0, current=0, solved=false;

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}

function render(){
 solved=false;
 const c=cases[current];
 $("roundLabel").textContent=`CASE ${current+1}`;
 $("caseNo").textContent=`${current+1}/10`;
 $("scenario").textContent=c.scenario;
 $("prompt").textContent=c.task;
 $("feedback").className="feedback";
 $("feedback").style.display="none";
 $("hintBox").style.display="none";
 $("nextBtn").disabled=true;
 $("bar").style.width=`${(current/10)*100}%`;
 const opts=shuffle(labels);
 $("options").innerHTML="";
 opts.forEach(label=>{
   const b=document.createElement("button");
   b.className="opt"; b.textContent=label;
   b.addEventListener("click",()=>answer(b,label));
   $("options").appendChild(b);
 });
 $("hintBtn").onclick=()=>{ $("hintBox").textContent=c.hint; $("hintBox").style.display="block"; };
}

function answer(btn,label){
 if(solved)return;
 attempts++;
 if(label===cases[current].ans){
   solved=true; correct++; score+=100; streak++;
   btn.classList.add("correct");
   [...$("options").children].forEach(x=>x.disabled=true);
   $("feedback").className="feedback good";
   $("feedback").innerHTML=`<strong>✓ Case solved!</strong><br>${cases[current].why}`;
   $("nextBtn").disabled=false;
 }else{
   streak=0;
   btn.classList.add("wrong"); btn.disabled=true;
   $("feedback").className="feedback bad";
   $("feedback").innerHTML=`<strong>Not quite.</strong> That choice does not fit the evidence. Try another choice.`;
 }
 update();
}
function update(){
 $("score").textContent=score;
 $("streak").textContent=streak;
 $("accuracy").textContent=attempts?Math.round(correct/attempts*100)+"%":"0%";
}
$("nextBtn").addEventListener("click",()=>{
 if(current<cases.length-1){current++;render();}
 else finish();
});
function finish(){
 $("bar").style.width="100%";
 $("roundLabel").textContent="🏆 INVESTIGATION COMPLETE";
 $("scenario").textContent="You have completed the Choice Gap Detective.";
 $("prompt").textContent="Review your score, then replay to sharpen your questionnaire design skills.";
 $("options").innerHTML="";
 const pct=Math.round(correct/cases.length*100);
 let msg=pct===100?"PERFECT DETECTIVE WORK! Every case was solved.":"Excellent investigation! Replay and aim for a perfect score.";
 $("feedback").className="feedback good";
 $("feedback").style.display="block";
 $("feedback").innerHTML=`<strong>${msg}</strong><br>Cases solved: ${correct}/10 • Final score: ${score}`;
 $("nextBtn").textContent="↻ Play Again";
 $("nextBtn").disabled=false;
 $("nextBtn").onclick=()=>{score=0;streak=0;attempts=0;correct=0;current=0;update();$("nextBtn").textContent="Next Case →";$("nextBtn").onclick=null;render();};
}
render(); update();
</script>
</body>
</html>

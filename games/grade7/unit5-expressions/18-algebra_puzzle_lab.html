<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Temmy Smart Games — Algebra Puzzle Lab</title>
<style>
:root{--blue:#153b7a;--gold:#c99700;--purple:#6a3fb5;--green:#198754;--red:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef3ff,#fff);color:#17233d}
.container{max-width:940px;margin:auto;padding:18px}
header{background:linear-gradient(135deg,var(--blue),#315fa9);color:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 8px 24px #0002}
header h1{margin:0;font-size:clamp(25px,5vw,40px)}header p{margin:8px 0 0}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.badge{background:#fff;border:2px solid #dce4f5;border-radius:12px;padding:8px 13px;font-weight:800}
.sound{border:0;background:#17233d;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}
.card{background:#fff;border-radius:20px;padding:22px;margin-top:15px;box-shadow:0 6px 20px #0001}
.progress{height:10px;background:#e5e9f2;border-radius:10px;overflow:hidden;margin:8px 0 20px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:.3s}
.tag{display:inline-block;background:#eee8ff;color:#56339c;padding:6px 10px;border-radius:20px;font-weight:800;font-size:13px}
.puzzle{background:#f7f8fc;border:2px solid #dbe1ee;border-radius:16px;padding:20px;margin:18px auto;max-width:680px;text-align:center}
.puzzle h2{margin:0 0 14px;color:var(--blue);font-size:20px}.equation{font-size:clamp(26px,6vw,43px);font-weight:900;margin:14px 0}
.question{text-align:center;font-size:20px;font-weight:800;margin:18px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{border:3px solid #d9e0ee;background:#fff;border-radius:16px;padding:17px;font-size:20px;font-weight:900;cursor:pointer;transition:.15s}.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}
.choice.correct{background:#e4f7eb;border-color:var(--green);color:#12633b}.choice.wrong{background:#ffe8e8;border-color:var(--red);color:#a51f1f}.choice:disabled{cursor:not-allowed}
.feedback{min-height:42px;text-align:center;font-weight:800;margin:14px 0 4px}.explain{display:none;background:#eef7ff;border-left:5px solid var(--blue);padding:13px;border-radius:10px;margin-top:10px}
.hint{display:none;background:#fff8dc;border-left:5px solid var(--gold);padding:13px;border-radius:10px;margin-top:10px}
.actions{text-align:center;margin-top:15px}.action{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;margin:4px}.hintbtn{background:#f0e9ff;color:#56339c}.next{background:var(--blue);color:#fff;display:none}
#final{display:none;text-align:center}.trophy{font-size:58px;animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.12)}}
.finalscore{font-size:48px;font-weight:900;color:var(--blue);margin:12px}.result{font-size:20px;font-weight:800}
.confetti{position:fixed;top:-15px;width:10px;height:18px;animation:fall 2.5s linear forwards;z-index:10}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:600px){.choices{grid-template-columns:1fr}.card{padding:16px}.puzzle{padding:15px}}
</style>
</head>
<body>
<div class="container">
<header><h1>🧠 Algebra Puzzle Lab</h1><p>Solve the clue, connect the steps, and unlock the hidden answer.</p></header>
<div class="top">
<div class="badge">⭐ Actual Score: <span id="score">0</span>/10</div><div class="badge">🔥 Streak: <span id="streak">0</span></div>
<div class="badge">🎯 Puzzle: <span id="num">1</span>/10</div><button class="sound" id="sound">🔊 Sound ON</button>
</div>

<div class="card" id="game">
<div class="progress"><div class="bar" id="bar"></div></div><span class="tag">MULTI-STEP REASONING</span>
<div class="puzzle"><h2 id="title"></h2><div class="equation" id="equation"></div><div id="clue"></div></div>
<div class="question" id="question"></div><div class="choices" id="choices"></div>
<div class="feedback" id="feedback"></div><div class="explain" id="explain"></div><div class="hint" id="hint"></div>
<div class="actions"><button class="action hintbtn" id="hintBtn">💡 Hint</button><button class="action next" id="nextBtn">Next →</button></div>
</div>

<div class="card" id="final">
<div class="trophy" id="trophy">🏆</div><h2>Algebra Puzzle Lab Complete!</h2>
<div class="finalscore" id="finalscore">0 / 10</div><div class="result" id="result"></div>
<p>Accuracy: <b id="accuracy"></b> &nbsp; | &nbsp; Best streak: <b id="best"></b></p>
<button class="action next" style="display:inline-block" onclick="location.reload()">🔄 Play Again</button>
</div>
</div>

<script>
const qs=[
{t:"Balance Puzzle",e:"x + 7 = 19",c:"A hidden number plus 7 gives 19.",q:"What is x?",a:"12",o:["10","11","12","13"],h:"Undo +7 by subtracting 7 from both sides.",x:"19 − 7 = 12, so x = 12."},
{t:"Double Clue",e:"2n + 4 = 18",c:"The number is doubled, then 4 is added.",q:"What is n?",a:"7",o:["6","7","8","9"],h:"First undo the +4, then undo the ×2.",x:"18 − 4 = 14, then 14 ÷ 2 = 7."},
{t:"Reverse Machine",e:"3p − 5 = 16",c:"A number is multiplied by 3, then 5 is removed.",q:"What number entered the machine?",a:"7",o:["6","7","8","9"],h:"Put the 5 back first, then divide by 3.",x:"16 + 5 = 21, then 21 ÷ 3 = 7."},
{t:"Mystery Total",e:"2a + 2b",c:"a = 3 and b = 5.",q:"What is the value of the expression?",a:"16",o:["13","15","16","20"],h:"Substitute both values before calculating.",x:"2(3) + 2(5) = 6 + 10 = 16."},
{t:"Perimeter Puzzle",e:"4(2t + 3)",c:"A square has side length 2t + 3. t = 4.",q:"What is the perimeter?",a:"44",o:["22","38","44","52"],h:"Find the side length first, then multiply by 4.",x:"Side = 2(4)+3 = 11. Perimeter = 4 × 11 = 44."},
{t:"Expression Code",e:"5m + 3",c:"The code gives 28 when m is entered.",q:"Which value of m unlocks the code?",a:"5",o:["4","5","6","7"],h:"Undo the +3, then divide by 5.",x:"28 − 3 = 25; 25 ÷ 5 = 5."},
{t:"Two-Step Shop",e:"3x + 2",c:"Three identical items plus a fixed 2 OMR fee cost 20 OMR.",q:"What is the price of one item?",a:"6",o:["5","6","7","8"],h:"Remove the fixed fee before sharing the rest among 3 items.",x:"20 − 2 = 18; 18 ÷ 3 = 6 OMR."},
{t:"Number Pattern",e:"4, 7, 10, 13, …",c:"Each term increases by the same amount.",q:"What is the next term?",a:"16",o:["14","15","16","17"],h:"Find the constant change between consecutive terms.",x:"Each term increases by 3, so 13 + 3 = 16."},
{t:"Equivalent Puzzle",e:"2(x + 4)",c:"Choose the expression that represents the same value.",q:"Which expression is equivalent?",a:"2x + 8",o:["2x + 4","x + 8","2x + 8","2x + 16"],h:"Multiply 2 by both terms inside the brackets.",x:"2(x + 4) = 2x + 8."},
{t:"Final Code",e:"2x + 5 = 25",c:"Solve the equation, then use the value of x.",q:"What is x?",a:"10",o:["8","9","10","15"],h:"Subtract 5 first, then divide by 2.",x:"25 − 5 = 20; 20 ÷ 2 = 10."}
];

let i=0,score=0,streak=0,best=0,soundOn=true,answered=false,attempted=false;
const $=id=>document.getElementById(id);
function tone(f,d=.12,type="sine"){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function load(){
 answered=false;attempted=false;$("num").textContent=i+1;$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=(i/10*100)+"%";
 $("title").textContent=qs[i].t;$("equation").textContent=qs[i].e;$("clue").textContent=qs[i].c;$("question").textContent=qs[i].q;
 $("feedback").textContent="";$("explain").style.display="none";$("hint").style.display="none";$("nextBtn").style.display="none";$("hintBtn").style.display="inline-block";
 const data=[...qs[i].o].sort(()=>Math.random()-.5);$("choices").innerHTML="";
 data.forEach(v=>{const b=document.createElement("button");b.className="choice";b.textContent=v;b.addEventListener("click",()=>answer(b,v));$("choices").appendChild(b)});
}
function answer(btn,v){
 if(answered)return;const firstAttempt=!attempted;attempted=true;
 if(v===qs[i].a){
  answered=true;
  if(firstAttempt){score++;streak++;best=Math.max(best,streak);$("feedback").textContent="✅ Correct on your first attempt! +1 point"}
  else{streak=0;$("feedback").textContent="✅ Correct! Learning retry — no point added."}
  btn.classList.add("correct");$("explain").textContent="🧠 "+qs[i].x;$("explain").style.display="block";$("nextBtn").style.display="inline-block";$("hintBtn").style.display="none";
  [...document.querySelectorAll(".choice")].forEach(b=>b.disabled=true);tone(660)
 }else{streak=0;btn.classList.add("wrong");btn.disabled=true;$("feedback").textContent="❌ Not correct. No point for this puzzle. Try again to learn.";tone(180,.16,"square")}
 $("score").textContent=score;$("streak").textContent=streak;
}
$("hintBtn").onclick=()=>{$("hint").textContent=qs[i].h;$("hint").style.display="block";tone(420,.08)};
$("nextBtn").onclick=()=>{i++;if(i>=qs.length)finish();else load()};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(soundOn)tone(520,.08)};
function finish(){
 $("game").style.display="none";$("final").style.display="block";$("finalscore").textContent=score+" / 10";$("accuracy").textContent=(score*10)+"%";$("best").textContent=best;
 if(score===10){$("result").textContent="PERFECT SCORE! You solved every puzzle!";$("trophy").textContent="🏆✨🧠";confetti(80);tone(523,.18);setTimeout(()=>tone(659,.18),180);setTimeout(()=>tone(784,.3),360)}
 else if(score>=8){$("result").textContent="Excellent multi-step reasoning!";$("trophy").textContent="🌟🧠"}
 else if(score>=6){$("result").textContent="Good work. Keep connecting each clue to the next step.";$("trophy").textContent="👏🔎"}
 else{$("result").textContent="Keep practising. Break each puzzle into smaller steps.";$("trophy").textContent="💪📚"}
}
function confetti(n){for(let j=0;j<n;j++){const e=document.createElement("div");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}}
load();
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temmy Smart Games — Expressions Master</title>
<style>
:root{--blue:#153b7a;--gold:#c99700;--purple:#6b3fa0;--green:#148a55;--red:#c62828;--ink:#172033}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#fff);color:var(--ink);min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:18px}header{background:linear-gradient(135deg,var(--blue),#2458a6);color:#fff;border-radius:22px;padding:22px;text-align:center;box-shadow:0 12px 28px #153b7a25}
header h1{margin:0;font-size:clamp(28px,6vw,46px)}header p{margin:7px 0 0}.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.badge,#sound{background:#fff;border:1px solid #dbe2ef;border-radius:999px;padding:9px 13px;font-weight:800}#sound{cursor:pointer}
.card{background:#fff;border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 10px 30px #17203314}.skill{display:inline-block;background:#efe7ff;color:#5d2e91;padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px}
.progress{height:10px;background:#e9edf5;border-radius:999px;overflow:hidden;margin:16px 0}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));width:0%;transition:.4s}
.prompt{font-size:clamp(20px,4.5vw,30px);line-height:1.4;margin:18px 0}.options{display:grid;gap:11px}.opt{border:2px solid #dce3ef;background:#fff;border-radius:15px;padding:14px;text-align:left;font-size:18px;font-weight:700;cursor:pointer}
.opt.wrong{background:#ffe8e8;border-color:var(--red);color:#9d1717;cursor:not-allowed}.opt.correct{background:#e4f7ed;border-color:var(--green);color:#11643f}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.action{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:white}.secondary{background:#eeeef6;color:#30334b}
.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f4f7fb;line-height:1.5;display:none}.show{display:block}.hint{background:#fff8dd;border-left:5px solid var(--gold)}
.final{display:none;text-align:center;padding:28px}.final.show{display:block;animation:pop .65s ease}.scorebig{font-size:64px;font-weight:900;color:var(--blue);animation:pulse 1.1s infinite alternate}
.celebrate{font-size:30px;font-weight:900;color:var(--purple);margin:8px}.stars{font-size:36px;letter-spacing:6px}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.piece{position:absolute;top:-20px;width:9px;height:16px;animation:fall 2.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}.small{font-size:13px;color:#667085}footer{text-align:center;padding:18px;color:#667085;font-size:13px}
</style></head><body><div class="wrap">
<header><h1>🏆 Expressions Master</h1><p>Temmy Smart Games • Grade 7 Mathematics • Unit 5</p></header>
<div class="top"><div class="badge">⭐ Actual Score: <span id="score">0</span>/12</div><div class="badge">🔥 Streak: <span id="streak">0</span></div><div class="badge">🎯 Accuracy: <span id="accuracy">0%</span></div><button id="sound">🔊 Sound ON</button></div>
<section class="card" id="game"><div class="small">Mastery Round <span id="num">1</span> of 12</div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="skill" id="skill"></div><div class="prompt" id="prompt"></div><div class="options" id="options"></div>
<div class="controls"><button class="action secondary" id="hintBtn">💡 Hint</button><button class="action" id="nextBtn" style="display:none">Next ➜</button></div>
<div class="feedback" id="feedback"></div><div class="feedback hint" id="hint"></div></section>
<section class="card final" id="final"><div class="stars" id="stars">⭐ ⭐ ⭐</div><div class="celebrate" id="celebrate"></div><div class="scorebig" id="finalScore"></div>
<p id="finalText"></p><div class="controls" style="justify-content:center"><button class="action" onclick="location.reload()">🔄 Play Again</button></div></section>
<footer>Learn • Play • Think • Achieve</footer></div><div class="confetti" id="confetti"></div>
<script>
const QUESTIONS=[["Identify the parts", "In the expression <strong>7x + 5</strong>, which number is the coefficient of x?", ["5", "7", "x", "12"], 1, "The coefficient is the number multiplying the variable. In 7x + 5, it is 7."], ["Word → expression", "Which expression means <strong>three times a number n, then add 8</strong>?", ["3 + n + 8", "3n + 8", "3(n + 8)", "n + 24"], 1, "Three times n is 3n, then add 8: 3n + 8."], ["Substitution", "If <strong>a = 4</strong>, what is the value of <strong>3a + 5</strong>?", ["12", "17", "20", "9"], 1, "3(4) + 5 = 17."], ["Order of operations", "Evaluate <strong>24 − 8 ÷ 2 + 3</strong>.", ["11", "23", "19", "14"], 1, "Division first: 8 ÷ 2 = 4. Then 24 − 4 + 3 = 23."], ["Equivalent expressions", "Which expression is equivalent to <strong>4x + 12</strong>?", ["4(x + 3)", "4(x + 12)", "x + 16", "12x + 4"], 0, "Factoring out 4 gives 4(x + 3)."], ["Transformation", "Which is the correct expansion of <strong>5(y + 2)</strong>?", ["5y + 2", "5y + 10", "y + 10", "10y + 5"], 1, "Distribute 5: 5y + 10."], ["Missing value", "Find the missing number: <strong>2n + 6 = 20</strong>.", ["7", "8", "13", "14"], 0, "Subtract 6, then divide by 2: n = 7."], ["Application", "A rectangle has length <strong>x + 3</strong> cm and width <strong>5</strong> cm. What is its perimeter?", ["x + 8", "2x + 16", "5x + 15", "2x + 6"], 1, "2[(x + 3) + 5] = 2x + 16."], ["Reasoning", "Which statement is true for <strong>every value of x</strong>?", ["2x + 5 = 2(x + 5)", "3x + 4 = 4 + 3x", "x + 7 = 7x", "5x = x + 5"], 1, "Addition can be written in either order, so 3x + 4 and 4 + 3x are equivalent."], ["Integrated challenge", "A number n is multiplied by 3 and then 4 is subtracted. The result is 17. Which equation and value are correct?", ["3n + 4 = 17, n = 13/3", "3n − 4 = 17, n = 7", "3(n − 4) = 17, n = 17/3", "n − 3 × 4 = 17, n = 29"], 1, "The words give 3n − 4 = 17. Therefore 3n = 21 and n = 7."], ["Mixed mastery", "If <strong>p = 6</strong>, which expression has value <strong>20</strong>?", ["2p + 6", "3p + 2", "p + 14", "4p − 2"], 1, "Substitute p = 6: 3(6) + 2 = 20."], ["Final reasoning", "Which pair represents the same expression?", ["2(x + 5) and 2x + 5", "6a + 12 and 6(a + 2)", "4m + 8 and 4(m + 8)", "5r − 10 and 5(r − 10)"], 1, "Distributing 6 gives 6(a + 2) = 6a + 12."]];
let i=0,score=0,streak=0,attempts=0,firstAnswered=false,locked=false,soundOn=true;
const $=id=>document.getElementById(id);
function tone(freq,d=.12){if(!soundOn)return;try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function render(){locked=false;firstAnswered=false;let q=QUESTIONS[i];$("num").textContent=i+1;$("skill").textContent=q[0];$("prompt").innerHTML=q[1];$("score").textContent=score;$("streak").textContent=streak;$("accuracy").textContent=attempts?Math.round(score/attempts*100)+"%":"0%";$("bar").style.width=(i/QUESTIONS.length*100)+"%";$("feedback").className="feedback";$("feedback").innerHTML="";$("hint").style.display="none";$("nextBtn").style.display="none";let box=$("options");box.innerHTML="";
shuffle(q[2].map((text,idx)=>({text,idx}))).forEach(o=>{let b=document.createElement("button");b.className="opt";b.innerHTML=o.text;b.addEventListener("click",()=>choose(b,o.idx));box.appendChild(b)})}
function choose(btn,idx){if(locked)return;let q=QUESTIONS[i];attempts++;if(idx===q[3]){btn.classList.add("correct");locked=true;if(!firstAnswered){score++;streak++}else{streak=0} $("score").textContent=score;$("streak").textContent=streak;$("accuracy").textContent=Math.round(score/attempts*100)+"%";[...$("options").children].forEach(b=>b.disabled=true);$("feedback").innerHTML="<strong>✅ Correct!</strong><br>"+q[4];$("feedback").className="feedback show";$("nextBtn").style.display="inline-block";tone(740);setTimeout(()=>tone(980,.16),100)}else{btn.classList.add("wrong");btn.disabled=true;streak=0;firstAnswered=true;$("streak").textContent=0;$("feedback").innerHTML="<strong>❌ Not quite.</strong> Try another choice. Your first-attempt score is fixed for this round."; $("feedback").className="feedback show";tone(180,.16)}}
$("nextBtn").addEventListener("click",()=>{i++;i<QUESTIONS.length?render():finish()});
$("hintBtn").addEventListener("click",()=>{let h=["Look for the number multiplying the variable.","Translate each phrase one part at a time.","Replace the variable with its given value, then calculate.","Do division before addition or subtraction.","Try factoring out the common number.","Distribute the number to every term inside the brackets.","Undo the operations in reverse order.","Perimeter means add all sides, or use 2(length + width).","Equivalent expressions have the same value for every x.","Translate the words into an equation before solving.","Substitute p = 6 into each option.","Distribute the outside factor to check both sides."][$("num").textContent-1];$("hint").textContent="💡 "+h;$("hint").style.display="block"});
$("sound").addEventListener("click",()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(soundOn)tone(600)});
function finish(){$("game").style.display="none";$("final").classList.add("show");$("bar").style.width="100%";let pct=Math.round(score/QUESTIONS.length*100);$("finalScore").textContent=score+" / "+QUESTIONS.length;$("finalText").innerHTML="Accuracy: <strong>"+pct+"%</strong><br>Final score uses first-attempt mastery. Retries help learning but do not add points.";if(pct===100){$("celebrate").textContent="🏆 EXPRESSIONS MASTER! PERFECT SCORE!";$("stars").textContent="⭐ ⭐ ⭐ ⭐ ⭐";confetti();tone(660,.18);setTimeout(()=>tone(880,.18),120);setTimeout(()=>tone(1100,.25),240)}else if(pct>=80){$("celebrate").textContent="🌟 Excellent Expression Mastery!";$("stars").textContent="⭐ ⭐ ⭐ ⭐";confetti()}else if(pct>=60){$("celebrate").textContent="👏 Good Work — Keep Building!"}else{$("celebrate").textContent="💪 Keep Practising — You Can Master It!"}}
function confetti(){let box=$("confetti");box.innerHTML="";for(let n=0;n<90;n++){let p=document.createElement("div");p.className="piece";p.style.left=Math.random()*100+"%";p.style.animationDelay=Math.random()*.8+"s";p.style.background=["#153b7a","#c99700","#6b3fa0","#148a55","#e05252"][n%5];box.appendChild(p)}}
render();
</script></body></html>

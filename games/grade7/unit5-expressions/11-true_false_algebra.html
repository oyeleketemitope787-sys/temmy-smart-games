<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Temmy Smart Games — True/False Algebra</title>
<style>
:root{--blue:#153b7a;--gold:#c99700;--purple:#6a3fb5;--green:#198754;--red:#c62828;--bg:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef3ff,#fff);color:#17233d}
.container{max-width:920px;margin:auto;padding:18px}
header{background:linear-gradient(135deg,var(--blue),#315fa9);color:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 8px 24px #0002}
header h1{margin:0;font-size:clamp(25px,5vw,40px)}
header p{margin:7px 0 0;font-size:15px}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.badge{background:#fff;border:2px solid #dce4f5;border-radius:12px;padding:8px 13px;font-weight:700}
.sound{cursor:pointer;border:0;background:#17233d;color:#fff;border-radius:10px;padding:9px 13px;font-weight:700}
.card{background:#fff;border-radius:20px;padding:22px;margin-top:15px;box-shadow:0 6px 20px #0001}
.progress{height:10px;background:#e5e9f2;border-radius:10px;overflow:hidden;margin:8px 0 20px}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:.3s}
.tag{display:inline-block;background:#eee8ff;color:#56339c;padding:6px 10px;border-radius:20px;font-weight:700;font-size:13px}
.statement{font-size:clamp(24px,5vw,38px);font-weight:800;text-align:center;margin:28px 0;line-height:1.3}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button.choice{border:3px solid #d9e0ee;background:#fff;border-radius:16px;padding:17px;font-size:20px;font-weight:800;cursor:pointer;transition:.15s}
button.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}
button.choice.correct{background:#e4f7eb;border-color:var(--green);color:#12633b}
button.choice.wrong{background:#ffe8e8;border-color:var(--red);color:#a51f1f}
button.choice:disabled{cursor:not-allowed}
.feedback{min-height:45px;text-align:center;font-weight:700;margin:15px 0 5px;font-size:16px}
.hint{background:#fff8dc;border-left:5px solid var(--gold);padding:12px;border-radius:10px;margin-top:12px;display:none}
.actions{text-align:center;margin-top:15px}
.actionbtn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;margin:4px}
.next{background:var(--blue);color:#fff;display:none}
.hintbtn{background:#f0e9ff;color:#56339c}
#final{display:none;text-align:center}
.finalScore{font-size:48px;font-weight:900;color:var(--blue);margin:12px}
.result{font-size:20px;font-weight:800}
.celebrate{font-size:55px;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.confetti{position:fixed;top:-15px;width:10px;height:18px;animation:fall 2.5s linear forwards;z-index:10}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:600px){.choices{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🧠 True/False Algebra</h1>
<p>Think carefully. Decide whether each algebra statement is TRUE or FALSE.</p>
</header>

<div class="top">
<div class="badge">⭐ Score: <span id="score">0</span>/10</div>
<div class="badge">🔥 Streak: <span id="streak">0</span></div>
<div class="badge">🎯 Question: <span id="num">1</span>/10</div>
<button class="sound" id="soundBtn">🔊 Sound ON</button>
</div>

<div class="card" id="game">
<div class="progress"><div class="bar" id="bar"></div></div>
<span class="tag" id="type">CHECK THE STATEMENT</span>
<div class="statement" id="statement"></div>
<div class="choices">
<button class="choice" data-value="true">✅ TRUE</button>
<button class="choice" data-value="false">❌ FALSE</button>
</div>
<div class="feedback" id="feedback"></div>
<div class="hint" id="hint"></div>
<div class="actions">
<button class="actionbtn hintbtn" id="hintBtn">💡 Hint</button>
<button class="actionbtn next" id="nextBtn">Next →</button>
</div>
</div>

<div class="card" id="final">
<div class="celebrate" id="celebrate">🏆</div>
<h2>Algebra Complete!</h2>
<div class="finalScore" id="finalScore">0 / 10</div>
<div class="result" id="result"></div>
<p>Accuracy: <b id="accuracy"></b> &nbsp; | &nbsp; Best streak: <b id="best"></b></p>
<button class="actionbtn next" style="display:inline-block" onclick="location.reload()">🔄 Play Again</button>
</div>
</div>

<script>
const questions=[
 {s:"x + 5 = 12 when x = 7.",a:true,h:"Substitute 7 for x and calculate 7 + 5."},
 {s:"3n = 21 when n = 6.",a:false,h:"Substitute 6 for n. Does 3 × 6 equal 21?"},
 {s:"2a + 4 = 10 when a = 3.",a:true,h:"Replace a with 3 and calculate 2 × 3 + 4."},
 {s:"5 + m means five times m.",a:false,h:"Look at the operation between 5 and m."},
 {s:"7p means 7 × p.",a:true,h:"A number written directly beside a variable means multiplication."},
 {s:"n + n can be written as 2n.",a:true,h:"Think about how many n's are being added."},
 {s:"3x + 2 and 2 + 3x are equivalent expressions.",a:true,h:"Changing the order of addition does not change the total."},
 {s:"4y means y + 4.",a:false,h:"4y represents multiplication, not addition."},
 {s:"If x = 5, then x − 2 = 8.",a:false,h:"Substitute 5 for x and calculate."},
 {s:"2r + 3 = 11 when r = 4.",a:true,h:"Substitute 4 for r: 2 × 4 + 3."}
];

let index=0,score=0,streak=0,best=0,sound=true,locked=false;
const $=id=>document.getElementById(id);
const choices=[...document.querySelectorAll(".choice")];

function tone(freq,duration=.12,type="sine"){
 if(!sound)return;
 try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
 o.type=type;o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(ctx.destination);
 o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.stop(ctx.currentTime+duration)}catch(e){}
}
function load(){
 locked=false;$("num").textContent=index+1;$("statement").textContent=questions[index].s;
 $("score").textContent=score;$("streak").textContent=streak;
 $("bar").style.width=((index)/questions.length*100)+"%";
 $("feedback").textContent="";$("hint").style.display="none";$("hint").textContent="";
 $("nextBtn").style.display="none";$("hintBtn").style.display="inline-block";
 choices.forEach(b=>{b.disabled=false;b.className="choice"});
}
function finish(){
 $("game").style.display="none";$("final").style.display="block";
 $("finalScore").textContent=score+" / 10";
 const acc=score*10;$("accuracy").textContent=acc+"%";$("best").textContent=best;
 if(score===10){$("result").textContent="PERFECT SCORE! Every algebra statement was correct!";$("celebrate").textContent="🏆✨🎉";confetti(80);tone(523,.18);setTimeout(()=>tone(659,.18),180);setTimeout(()=>tone(784,.3),360)}
 else if(score>=8){$("result").textContent="Excellent algebra thinking!";$("celebrate").textContent="🌟🎯"}
 else if(score>=6){$("result").textContent="Good work. Keep checking each statement carefully!";$("celebrate").textContent="👏🧠"}
 else{$("result").textContent="Keep practising. Read the operation and substitute carefully!";$("celebrate").textContent="💪📚"}
}
function confetti(n){
 for(let i=0;i<n;i++){let e=document.createElement("div");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*1.2+"s";e.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
}
choices.forEach(btn=>btn.addEventListener("click",()=>{
 if(locked)return;locked=true;
 const picked=btn.dataset.value==="true",q=questions[index];
 if(picked===q.a){
   score++;streak++;best=Math.max(best,streak);btn.classList.add("correct");$("feedback").textContent="✅ Correct!";tone(660,.12);
   choices.forEach(b=>b.disabled=true);$("nextBtn").style.display="inline-block";$("hintBtn").style.display="none";
 }else{
   streak=0;btn.classList.add("wrong");btn.disabled=true;$("feedback").textContent="❌ Not quite. Try the other choice.";tone(180,.16,"square");
   locked=false;
 }
 $("score").textContent=score;$("streak").textContent=streak;
}));
$("hintBtn").addEventListener("click",()=>{$("hint").textContent=questions[index].h;$("hint").style.display="block";tone(420,.08)});
$("nextBtn").addEventListener("click",()=>{index++;if(index>=questions.length)finish();else load()});
$("soundBtn").addEventListener("click",()=>{sound=!sound;$("soundBtn").textContent=sound?"🔊 Sound ON":"🔇 Sound OFF";if(sound)tone(520,.08)});
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Temmy Smart Games — Expression Transformation Lab</title>
<style>
:root{--blue:#153b7a;--gold:#c99700;--purple:#6a3fb5;--green:#198754;--red:#c62828}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef3ff,#fff);color:#17233d}
.container{max-width:940px;margin:auto;padding:18px}
header{background:linear-gradient(135deg,var(--blue),#315fa9);color:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:0 8px 24px #0002}
header h1{margin:0;font-size:clamp(25px,5vw,40px)}header p{margin:8px 0 0}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.badge{background:#fff;border:2px solid #dce4f5;border-radius:12px;padding:8px 13px;font-weight:800}
.sound{border:0;background:#17233d;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}
.card{background:#fff;border-radius:20px;padding:22px;margin-top:15px;box-shadow:0 6px 20px #0001}
.progress{height:10px;background:#e5e9f2;border-radius:10px;overflow:hidden;margin:8px 0 20px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:.3s}
.tag{display:inline-block;background:#eee8ff;color:#56339c;padding:6px 10px;border-radius:20px;font-weight:800;font-size:13px}
.transform{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:28px 0}
.expr{font-size:clamp(25px,6vw,43px);font-weight:900;background:#f7f8fc;border:2px solid #dbe1ee;border-radius:16px;padding:18px 22px}
.arrow{font-size:34px;font-weight:900;color:var(--purple)}
.instruction{text-align:center;font-size:20px;font-weight:800;margin:15px 0 22px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{border:3px solid #d9e0ee;background:#fff;border-radius:16px;padding:17px;font-size:20px;font-weight:900;cursor:pointer;transition:.15s}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}.choice.correct{background:#e4f7eb;border-color:var(--green);color:#12633b}.choice.wrong{background:#ffe8e8;border-color:var(--red);color:#a51f1f}.choice:disabled{cursor:not-allowed}
.feedback{min-height:42px;text-align:center;font-weight:800;margin:14px 0 4px}.explain{display:none;background:#eef7ff;border-left:5px solid var(--blue);padding:13px;border-radius:10px;margin-top:10px}.hint{display:none;background:#fff8dc;border-left:5px solid var(--gold);padding:13px;border-radius:10px;margin-top:10px}
.actions{text-align:center;margin-top:15px}.action{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;margin:4px}.hintbtn{background:#f0e9ff;color:#56339c}.next{background:var(--blue);color:#fff;display:none}
#final{display:none;text-align:center}.trophy{font-size:58px;animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.12)}}
.finalscore{font-size:48px;font-weight:900;color:var(--blue);margin:12px}.result{font-size:20px;font-weight:800}
.confetti{position:fixed;top:-15px;width:10px;height:18px;animation:fall 2.5s linear forwards;z-index:10}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:600px){.choices{grid-template-columns:1fr}.card{padding:16px}.transform{gap:8px}}
</style>
</head>
<body>
<div class="container">
<header><h1>🔄 Expression Transformation Lab</h1><p>Transform an expression while keeping its meaning or value unchanged.</p></header>
<div class="top">
<div class="badge">⭐ Actual Score: <span id="score">0</span>/10</div><div class="badge">🔥 Streak: <span id="streak">0</span></div><div class="badge">🎯 Task: <span id="num">1</span>/10</div>
<button class="sound" id="sound">🔊 Sound ON</button>
</div>

<div class="card" id="game">
<div class="progress"><div class="bar" id="bar"></div></div><span class="tag">TRANSFORM • PRESERVE • CHECK</span>
<div class="transform"><div class="expr" id="from"></div><div class="arrow">→</div><div class="expr" id="to"></div></div>
<div class="instruction" id="instruction"></div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback"></div><div class="explain" id="explain"></div><div class="hint" id="hint"></div>
<div class="actions"><button class="action hintbtn" id="hintBtn">💡 Hint</button><button class="action next" id="nextBtn">Next →</button></div>
</div>

<div class="card" id="final">
<div class="trophy" id="trophy">🏆</div><h2>Transformation Lab Complete!</h2><div class="finalscore" id="finalscore">0 / 10</div><div class="result" id="result"></div>
<p>Accuracy: <b id="accuracy"></b> &nbsp; | &nbsp; Best streak: <b id="best"></b></p>
<button class="action next" style="display:inline-block" onclick="location.reload()">🔄 Play Again</button>
</div>
</div>

<script>
const qs=[
{f:"3x + 4",t:"4 + 3x",i:"Choose the rule that justifies this transformation.",a:"Change the order of addition.",o:["Change the order of addition.","Multiply the terms.","Subtract 4.","Divide by 3."],h:"The two terms stay the same; only their order changes.",x:"3x + 4 and 4 + 3x are equivalent because addition can be written in either order."},
{f:"5 + 2n",t:"2n + 5",i:"What changed?",a:"The order of the terms.",o:["The order of the terms.","The coefficient changed.","The variable disappeared.","The expression was divided by 2."],h:"Compare the two terms before and after.",x:"The same terms are present; they have simply changed places."},
{f:"2(x + 3)",t:"2x + 6",i:"Which transformation rule was used?",a:"Multiply 2 by both terms.",o:["Multiply 2 by both terms.","Add 2 to x.","Subtract 3 from both terms.","Divide every term by 2."],h:"The 2 outside the brackets affects both terms inside.",x:"Using the distributive property, 2(x + 3) = 2x + 6."},
{f:"3(y + 4)",t:"3y + 12",i:"Why are these expressions equivalent?",a:"3 is multiplied by both y and 4.",o:["3 is multiplied by both y and 4.","4 is added to 3.","y is multiplied by 12.","The brackets are ignored."],h:"Distribute the factor outside the brackets.",x:"3(y + 4) = 3y + 12."},
{f:"5a + 10",t:"5(a + 2)",i:"What transformation has been made?",a:"The common factor 5 was taken out.",o:["The common factor 5 was taken out.","The expression was doubled.","10 was divided by a.","The variable was removed."],h:"Look for a factor shared by both terms.",x:"5a + 10 = 5(a + 2). The common factor 5 is factored out."},
{f:"2r + 2s",t:"2(r + s)",i:"What transformation creates the second expression?",a:"Factor out 2.",o:["Factor out 2.","Add 2 to each term.","Multiply r by s.","Subtract 2."],h:"Both terms contain a common factor of 2.",x:"2r + 2s = 2(r + s)."},
{f:"7 + m",t:"m + 7",i:"Which property explains this change?",a:"Commutative property of addition.",o:["Commutative property of addition.","Distributive property.","Multiplication property.","Inverse operation."],h:"The terms swap positions but the sum stays the same.",x:"The commutative property allows the order of addends to change."},
{f:"4(p + 2)",t:"4p + 8",i:"What must happen to the 4?",a:"Multiply it by both terms.",o:["Multiply it by both terms.","Add it only to p.","Subtract it from 2.","Divide it by p."],h:"The factor outside brackets is distributed.",x:"4(p + 2) = 4p + 8."},
{f:"6x + 12",t:"6(x + 2)",i:"What happened to create the second form?",a:"Factor out the common factor 6.",o:["Factor out the common factor 6.","Multiply everything by 6.","Subtract 6.","Switch x and 12."],h:"Both terms are divisible by 6.",x:"6x + 12 = 6(x + 2)."},
{f:"2(t + 5)",t:"2t + 10",i:"Which statement is true?",a:"Both expressions have the same value for every t.",o:["Both expressions have the same value for every t.","The second is always 5 larger.","The first is always double the second.","They are only equal when t = 0."],h:"Expand the brackets and compare.",x:"2(t + 5) = 2t + 10, so they are equivalent for every value of t."}
];

let i=0,score=0,streak=0,best=0,soundOn=true,answered=false,attempted=false;
const $=id=>document.getElementById(id);
function tone(f,d=.12,type="sine"){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function load(){
 answered=false;attempted=false;$("num").textContent=i+1;$("score").textContent=score;$("streak").textContent=streak;$("bar").style.width=(i/10*100)+"%";
 $("from").textContent=qs[i].f;$("to").textContent=qs[i].t;$("instruction").textContent=qs[i].i;$("feedback").textContent="";$("explain").style.display="none";$("hint").style.display="none";$("nextBtn").style.display="none";$("hintBtn").style.display="inline-block";
 const data=[...qs[i].o].sort(()=>Math.random()-.5);$("choices").innerHTML="";
 data.forEach(v=>{const b=document.createElement("button");b.className="choice";b.textContent=v;b.addEventListener("click",()=>answer(b,v));$("choices").appendChild(b)});
}
function answer(btn,v){
 if(answered)return;const firstAttempt=!attempted;attempted=true;
 if(v===qs[i].a){
  answered=true;
  if(firstAttempt){score++;streak++;best=Math.max(best,streak);$("feedback").textContent="✅ Correct on your first attempt! +1 point"}
  else{streak=0;$("feedback").textContent="✅ Correct! Learning retry — no point added."}
  btn.classList.add("correct");$("explain").textContent="🧠 "+qs[i].x;$("explain").style.display="block";$("nextBtn").style.display="inline-block";$("hintBtn").style.display="none";[...document.querySelectorAll(".choice")].forEach(b=>b.disabled=true);tone(660)
 }else{streak=0;btn.classList.add("wrong");btn.disabled=true;$("feedback").textContent="❌ Not correct. No point for this task. Try again to learn.";tone(180,.16,"square")}
 $("score").textContent=score;$("streak").textContent=streak;
}
$("hintBtn").onclick=()=>{$("hint").textContent=qs[i].h;$("hint").style.display="block";tone(420,.08)};
$("nextBtn").onclick=()=>{i++;if(i>=qs.length)finish();else load()};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(soundOn)tone(520,.08)};
function finish(){
 $("game").style.display="none";$("final").style.display="block";$("finalscore").textContent=score+" / 10";$("accuracy").textContent=(score*10)+"%";$("best").textContent=best;
 if(score===10){$("result").textContent="PERFECT SCORE! You transformed every expression correctly!";$("trophy").textContent="🏆✨🔄";confetti(80);tone(523,.18);setTimeout(()=>tone(659,.18),180);setTimeout(()=>tone(784,.3),360)}
 else if(score>=8){$("result").textContent="Excellent transformation thinking!";$("trophy").textContent="🌟🔄"}
 else if(score>=6){$("result").textContent="Good work. Keep checking that the value or meaning stays unchanged.";$("trophy").textContent="👏🧠"}
 else{$("result").textContent="Keep practising. Transform one step at a time and check equivalence.";$("trophy").textContent="💪📚"}
}
function confetti(n){for(let j=0;j<n;j++){const e=document.createElement("div");e.className="confetti";e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}}
load();
</script>
</body>
</html>

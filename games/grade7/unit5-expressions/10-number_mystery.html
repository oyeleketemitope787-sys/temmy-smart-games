<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temmy Smart Games — Number Mystery</title>
<style>
:root{--blue:#153b7a;--gold:#c99700;--purple:#6b3fa0;--green:#16834b;--red:#c93636;--ink:#17233c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef4ff,#fff9e9);color:var(--ink)}
.app{max-width:1000px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,var(--blue),#315ca8);color:#fff;border-radius:23px;padding:20px;box-shadow:0 10px 28px #153b7a24}.brand{font-size:25px;font-weight:900;letter-spacing:1px}.sub{margin-top:5px;opacity:.9}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}.pill{background:#ffffff20;border:1px solid #ffffff40;border-radius:999px;padding:8px 13px;font-weight:800}.sound{margin-left:auto;border:0;border-radius:12px;padding:9px 14px;font-weight:900;color:var(--blue);background:#fff;cursor:pointer}
.card{background:#fff;border-radius:22px;padding:25px;margin-top:18px;box-shadow:0 8px 26px #253b5c18}.progress{height:10px;background:#e8edf5;border-radius:20px;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--purple));transition:.35s}.round{color:var(--purple);font-weight:900;font-size:14px;margin:15px 0 7px}.mission{font-size:27px;font-weight:900;text-align:center;margin:10px 0 15px}
.vault{background:#f4f7fc;border:2px dashed #ccd6e7;border-radius:18px;padding:21px;text-align:center}.lock{font-size:54px}.clue{font-size:22px;font-weight:900;line-height:1.5}.math{display:inline-block;margin-top:10px;background:#fff;border-radius:12px;padding:9px 15px;color:var(--purple);font-size:27px;font-weight:1000}.question{font-size:19px;font-weight:900;text-align:center;margin:18px 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:2px solid #dce3ee;background:#fff;border-radius:15px;padding:15px;cursor:pointer;font-size:20px;font-weight:900;transition:.15s}.choice:hover{border-color:var(--purple);background:#faf7ff;transform:translateY(-2px)}.choice.wrong{background:#ffe9e9;border-color:var(--red);color:#a31f1f;cursor:not-allowed}.choice.correct{background:#e8faef;border-color:var(--green);color:#0d6738}.choice:disabled{opacity:1}.feedback{min-height:58px;margin-top:16px;padding:13px 16px;background:#f5f7fb;border-radius:15px;font-weight:700;line-height:1.45}.hint{margin-top:12px;padding:11px;border-radius:12px;background:#fff7d9;border:1px solid #efd36a;color:#705600;font-weight:700}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer}.hintBtn{background:#fff2c5;color:#6d5300}.next{background:var(--blue);color:#fff;min-width:120px}.next:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;display:none;overflow:hidden}.result.show{display:block;animation:pop .6s ease}.trophy{font-size:74px;animation:bounce 1s infinite alternate}.celebrate{font-size:26px;font-weight:1000;color:var(--purple)}.final{font-size:54px;font-weight:1000;color:var(--blue);margin:8px}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:17px}.stat{background:#f3f6fb;border-radius:14px;padding:12px 18px;font-weight:900}.replay{background:var(--gold);color:#241c00}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;width:9px;height:16px;animation:fall 2.7s linear forwards}.footer{text-align:center;color:#667085;font-size:13px;padding:18px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:680px){.choices{grid-template-columns:1fr}.mission{font-size:23px}.clue{font-size:19px}.sound{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand">TEMMY SMART GAMES</div>
<div class="sub">Grade 7 Mathematics • Unit 5: Expressions</div>
<div class="bar">
<span class="pill">🔐 NUMBER MYSTERY</span><span class="pill" id="score">⭐ Score: 0/10</span><span class="pill" id="streak">🔥 Streak: 0</span>
<button class="sound" id="sound">🔊 Sound ON</button>
</div>
</header>

<section class="card" id="game">
<div class="progress"><div id="fill"></div></div>
<div class="round" id="round"></div>
<div class="mission">Crack the algebraic clue and reveal the mystery number.</div>
<div class="vault"><div class="lock">🔐</div><div class="clue" id="clue"></div><div class="math" id="math"></div></div>
<div class="question">What is the mystery number?</div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback">Use the clue to reason about the unknown number.</div>
<div id="hint"></div>
<div class="actions"><button class="btn hintBtn" id="hintBtn">💡 Hint</button><button class="btn next" id="next" disabled>Next →</button></div>
</section>

<section class="card result" id="result">
<div class="trophy" id="trophy">🏆</div><div class="celebrate" id="celebrate"></div>
<div class="final" id="final"></div>
<div class="stats"><div class="stat" id="accuracy"></div><div class="stat" id="best"></div></div>
<p id="resultText"></p><button class="btn replay" id="replay">🔄 Solve Again</button>
</section>
<div class="footer">Learn • Play • Think • Achieve</div><div class="confetti" id="confetti"></div>
</div>

<script>
const mysteries=[
{clue:"A number plus 5 equals 12.",math:"n + 5 = 12",a:"7",o:["5","6","7","8"],e:"Subtract 5 from both sides: n = 12 − 5 = 7.",h:"Undo +5 by subtracting 5."},
{clue:"Three times a number equals 21.",math:"3n = 21",a:"7",o:["6","7","8","9"],e:"Divide 21 by 3: n = 7.",h:"Undo multiplication by dividing by 3."},
{clue:"A number minus 4 equals 9.",math:"n − 4 = 9",a:"13",o:["5","12","13","14"],e:"Add 4 to both sides: n = 13.",h:"Undo −4 by adding 4."},
{clue:"Twice a number plus 3 equals 15.",math:"2n + 3 = 15",a:"6",o:["5","6","7","9"],e:"Subtract 3: 2n = 12. Divide by 2: n = 6.",h:"Undo the +3 first, then divide by 2."},
{clue:"Five more than a number is 17.",math:"n + 5 = 17",a:"12",o:["10","11","12","13"],e:"17 − 5 = 12, so the mystery number is 12.",h:"Take away the 5 that was added."},
{clue:"Four less than a number is 10.",math:"n − 4 = 10",a:"14",o:["6","13","14","16"],e:"10 + 4 = 14, so the number is 14.",h:"Add back the 4 that was subtracted."},
{clue:"The sum of a number and 9 is 20.",math:"n + 9 = 20",a:"11",o:["9","10","11","12"],e:"20 − 9 = 11.",h:"Subtract 9 from 20."},
{clue:"Six times a number is 42.",math:"6n = 42",a:"7",o:["6","7","8","9"],e:"42 ÷ 6 = 7.",h:"Divide 42 by 6."},
{clue:"Eight less than twice a number is 10.",math:"2n − 8 = 10",a:"9",o:["7","8","9","10"],e:"Add 8: 2n = 18. Divide by 2: n = 9.",h:"Undo −8 first, then undo ×2."},
{clue:"Three times a number plus 4 equals 25.",math:"3n + 4 = 25",a:"7",o:["6","7","8","9"],e:"Subtract 4: 3n = 21. Divide by 3: n = 7.",h:"Remove the +4, then divide by 3."}
];

let qs=[],i=0,score=0,streak=0,best=0,locked=false,soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}catch(e){return null}}
function beep(f,d=.12,type="sine"){if(!soundOn)return;const c=ensureAudio();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.03)}catch(e){}}
function correctSound(){beep(660,.09);setTimeout(()=>beep(880,.12),90)}function wrongSound(){beep(180,.15,"square")}
function load(){
 const q=qs[i];locked=false;$("fill").style.width=(i/qs.length*100)+"%";$("round").textContent=`MYSTERY ${i+1} OF ${qs.length}`;
 $("clue").textContent=q.clue;$("math").textContent=q.math;$("feedback").textContent="Use the clue to reason about the unknown number.";
 $("hint").innerHTML="";$("next").disabled=true;$("hintBtn").disabled=false;$("choices").innerHTML="";
 shuffle(q.o).forEach(x=>{const b=document.createElement("button");b.className="choice";b.textContent=x;b.addEventListener("click",()=>choose(b,x,q));$("choices").appendChild(b)})
}
function choose(btn,x,q){
 if(locked||btn.disabled)return;
 if(x===q.a){locked=true;score++;streak++;best=Math.max(best,streak);correctSound();btn.classList.add("correct");[...$("choices").children].forEach(b=>b.disabled=true);$("feedback").innerHTML=`✅ <b>Mystery solved!</b><br>${q.e}`;$("next").disabled=false;$("hintBtn").disabled=true}
 else{streak=0;wrongSound();btn.classList.add("wrong");btn.disabled=true;$("feedback").textContent="❌ Not the mystery number. Use the equation and try another choice."}
 update()
}
function update(){$("score").textContent=`⭐ Score: ${score}/${qs.length}`;$("streak").textContent=`🔥 Streak: ${streak}`}
$("hintBtn").onclick=()=>{const q=qs[i];$("hint").innerHTML=`<div class="hint">💡 Hint: ${q.h}</div>`;beep(440,.1)};
$("next").onclick=()=>{i++;if(i<qs.length)load();else finish()};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(soundOn){ensureAudio();beep(660,.1);setTimeout(()=>beep(880,.12),110)}};
function confetti(){ $("confetti").innerHTML="";for(let n=0;n<90;n++){let p=document.createElement("i");p.className="piece";p.style.left=Math.random()*100+"%";p.style.background=["#153b7a","#c99700","#6b3fa0","#16834b","#e85d75"][Math.floor(Math.random()*5)];p.style.animationDelay=Math.random()*1.2+"s";$("confetti").appendChild(p)}setTimeout(()=>$("confetti").innerHTML="",3500)}
function finish(){
 $("game").style.display="none";$("result").classList.add("show");let pct=Math.round(score/qs.length*100);$("final").textContent=`${score} / ${qs.length} Base Points`;$("accuracy").textContent=`🎯 Accuracy: ${pct}%`;$("best").textContent=`🔥 Best Streak: ${best}`;
 if(pct===100){$("trophy").textContent="🏆";$("celebrate").textContent="MYSTERY MASTER!";$("resultText").textContent="Every algebraic clue was cracked correctly.";confetti()}
 else if(pct>=90){$("trophy").textContent="🥇";$("celebrate").textContent="EXCELLENT DETECTIVE WORK!";$("resultText").textContent="You used algebraic reasoning very accurately."}
 else if(pct>=75){$("trophy").textContent="🥈";$("celebrate").textContent="STRONG REASONING!";$("resultText").textContent="Good progress. Review any equations you missed."}
 else{$("trophy").textContent="🔐";$("celebrate").textContent="KEEP CRACKING THE CODE!";$("resultText").textContent="Work backwards carefully: undo addition/subtraction first, then multiplication or division."}
 [523,659,784,1047].forEach((f,n)=>setTimeout(()=>beep(f,.16),n*100))
}
$("replay").onclick=()=>{qs=shuffle(mysteries);i=0;score=0;streak=0;best=0;update();$("result").classList.remove("show");$("result").style.display="none";$("game").style.display="block";load()};
qs=shuffle(mysteries);update();load();
</script>
</body>
</html>

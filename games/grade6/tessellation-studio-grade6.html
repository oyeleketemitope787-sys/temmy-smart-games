<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tessellation Studio | Temmy Smart Games</title>
<style>
:root{--b:#153b7a;--p:#6b46a8;--g:#c99700;--ink:#182238;--bg:#f2f5fb;--line:#dce4f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;font-weight:700}.wrap{max-width:900px;margin:auto;padding:12px}.hero{padding:16px;text-align:center;color:white;background:linear-gradient(120deg,var(--b),#2859a5,var(--p));border-radius:20px}.brand{border:1px solid #ffffffaa;border-radius:25px;padding:7px 12px;font-size:12px;letter-spacing:1px}.hero h1{font-size:clamp(25px,5vw,38px);margin:10px 0 4px}.hero p{font-weight:500;margin:0}.stats{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0}.pill{background:white;border:1px solid var(--line);border-radius:24px;padding:9px 11px;font-size:13px}.sound{background:#17233d;color:white;font:inherit;cursor:pointer}.card{background:white;border-radius:20px;padding:clamp(14px,3vw,24px);box-shadow:0 8px 25px #1720330b}.audio{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f5f7fc;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:14px;font-size:13px}.audio input{width:min(220px,40vw);accent-color:var(--p)}.tag{display:inline-block;padding:7px 11px;border-radius:20px;background:#efe8ff;color:#5c359c;font-size:12px}.progress{height:8px;background:#e5eaf4;border-radius:20px;overflow:hidden;margin-bottom:14px}.bar{height:100%;background:linear-gradient(90deg,var(--b),var(--p))}.question{font-size:clamp(20px,3.5vw,28px);line-height:1.35;margin:12px 0}.visual{min-height:135px;display:flex;align-items:center;justify-content:center;margin:6px 0 14px}.tiles{display:grid;grid-template-columns:repeat(4,48px);grid-template-rows:repeat(3,38px);gap:3px;padding:6px;background:#edf2fc;border-radius:10px}.tile{border:1px solid #cbd7ec;border-radius:4px;background:#fff;display:grid;place-items:center}.tile svg{width:100%;height:100%}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.opt{min-height:50px;border:2px solid var(--line);background:white;border-radius:13px;padding:11px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;line-height:1.35}.opt:disabled{opacity:1}.opt.correct{background:#e6f7ed;border-color:#19734b}.opt.wrong{background:#fff0ef;border-color:#b42318;color:#b42318}.feedback{display:none;margin-top:12px;padding:12px;border-radius:13px;line-height:1.45;background:#eef4ff}.feedback.show{display:block}.good{background:#e6f7ed!important}.bad{background:#fff0ef!important}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e9edf6;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--b);color:white}.btn:disabled{opacity:.45}.push{flex:1}.final{text-align:center;padding:24px 6px}.trophy{font-size:58px;animation:bob 1s ease-in-out infinite alternate}.big{font-size:clamp(42px,8vw,64px);color:var(--b);margin:12px}@keyframes bob{to{transform:translateY(-7px) rotate(-3deg)}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-15px;width:8px;height:14px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}footer{text-align:center;color:#657189;font-size:12px;padding:14px}@media(max-width:560px){.wrap{padding:8px}.options{grid-template-columns:1fr}.push{display:none}.tiles{grid-template-columns:repeat(4,42px);grid-template-rows:repeat(3,34px)}}@media(max-height:650px){.wrap{padding:6px}.hero{padding:8px}.hero h1{margin:4px}.stats{margin:6px 0}.card{padding:12px}.visual{min-height:75px;margin:3px}.question{margin:6px 0}.audio{margin-bottom:8px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head><body><main class="wrap"><header class="hero"><span class="brand">TEMMY SMART GAMES</span><h1>🧩 Tessellation Studio</h1><p>Grade 6 Mathematics · Unit 5: 2D Shapes</p></header>
<div class="stats"><span class="pill">⭐ Score: <b id="score">0/12</b></span><span class="pill">🔥 Streak: <b id="streak">0 (best 0)</b></span><span class="pill">🧩 Challenge: <b id="case">1/12</b></span><button class="pill sound" id="sound">🔊 Sound ON</button></div>
<section class="card" id="game"><div class="audio"><label for="volume">🔉 Sound volume</label><input id="volume" type="range" min="0" max="100" value="65"><output id="volout">65%</output><span>Adjust for your phone or smartboard.</span></div><div class="progress"><div class="bar" id="bar"></div></div><span class="tag" id="tag"></span><h2 class="question" id="question"></h2><div class="visual" id="visual"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="btn" id="prev">← Previous</button><button class="btn" id="hint">💡 Hint</button><span class="push"></span><button class="btn primary" id="next" disabled>Next →</button></div></section><footer>Temmy Smart Games · Learn • Play • Think • Achieve</footer></main><div class="confetti" id="confetti"></div>
<script>
const Q=[
["TILING BASICS","What does it mean when shapes tessellate?","pattern",["They overlap and leave gaps","They fit together with no gaps or overlaps","They must all be circles","They must be different sizes"],1,"Think about covering a floor completely.","Tessellating shapes fit together with no gaps or overlaps."],
["SPOT THE TILE","Which shape can tessellate on its own in a regular repeating pattern?","square",["A circle","A regular pentagon","A square","An oval"],2,"A square can repeat in rows without leaving spaces.","Squares tessellate because they fit together without gaps or overlaps."],
["PARALLELOGRAMS","Can parallelograms tessellate?","para",["Yes, they can fit with no gaps","No, they always leave triangular gaps","Only if they are circles","Only if they overlap"],0,"Think of the parallelogram tiles shown in your textbook.","Parallelograms can tessellate by repeating the same shape."],
["RHOMBUS TILING","Identical rhombuses fit edge-to-edge with no gaps. What is this arrangement?","rhombus",["A tessellation","A line of symmetry only","A 3D solid","A circle pattern"],0,"A repeating arrangement that covers a surface is called a tessellation.","This edge-to-edge arrangement is a tessellation."],
["GAP CHECK","A pattern leaves small empty spaces between tiles. Is it a tessellation?","gaps",["Yes, any repeated pattern","No, tessellations leave no gaps","Yes, if gaps are equal","Only if tiles are squares"],1,"The surface must be covered completely.","No. A tessellation leaves no gaps or overlaps."],
["OVERLAP CHECK","Tiles cover a floor but overlap. Does this meet the definition of tessellation?","overlap",["Yes, because no floor is visible","No, tiles must fit without overlaps","Yes, if colourful","Only if tiles are triangles"],1,"Tessellation requires both no gaps and no overlaps.","Overlapping tiles do not form a tessellation."],
["SPECIAL QUADRILATERALS","Which quadrilateral is shown in the textbook as a tessellating shape?","para",["Parallelogram","Circle","Oval","Sphere"],0,"The textbook example uses parallelograms fitting together.","Parallelograms can fit together to tessellate."],
["DECOMPOSING SHAPES","A square is cut along a diagonal. What two shapes are made?","split",["Two triangles","Two circles","Two trapeziums","Two pentagons"],0,"A diagonal joins opposite vertices and divides the square into two parts.","A diagonal divides a square into two triangles."],
["REBUILDING","Two identical triangles fit together to make a square. What does this show?","split",["Shapes can be decomposed and recombined","A square has five sides","Triangles are 3D shapes","All triangles are squares"],0,"Think about splitting a square and joining the pieces again.","Shapes can be decomposed into smaller shapes and recombined."],
["PATTERN REASONING","A repeating tile pattern fits exactly across a wall. Which condition must be true?","pattern",["Tiles leave no gaps or overlaps","Every tile has a curved edge","All tiles are circles","Tiles must be different shapes"],0,"A tessellation covers the surface exactly.","A tessellation has no gaps or overlaps."],
["WHY TILES WORK","Why are quadrilateral tiles useful for covering floors and walls?","pattern",["They can fit together to cover a surface","They always have curved sides","They cannot be repeated","They must leave gaps"],0,"Think about how tiles meet edge-to-edge.","Some quadrilaterals fit together repeatedly to cover surfaces without gaps."],
["FINAL CHALLENGE","Which statement is correct?","pattern",["A tessellation must leave gaps","Shapes fit together with no gaps or overlaps","A tessellation uses circles only","A tessellation is a 3D shape"],1,"Remember the definition of tessellation.","A tessellation is a pattern of shapes that fit together without gaps or overlaps."]
];
let i=0,score=0,streak=0,best=0,soundOn=true,volume=.65;const S=Q.map(()=>({wrong:new Set(),correct:false,first:false}));const $=id=>document.getElementById(id);
function beep(freq=650,dur=.12){if(!soundOn||volume<=0)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(Math.max(.0001,.12*volume),c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);o.onended=()=>c.close()}catch(e){}}
function mini(){return '<svg viewBox="0 0 50 40"><rect x="2" y="2" width="46" height="36" fill="#dbe7ff" stroke="#153b7a" stroke-width="2"/></svg>'}
function visual(t){if(['pattern','gaps','overlap'].includes(t)){return '<div class="tiles">'+Array.from({length:12},(_,n)=>'<div class="tile">'+(t==='gaps'&&n===5?'':t==='overlap'&&n===5?'<b style="color:#b42318;font-size:24px">×</b>':mini())+'</div>').join('')+'</div>'}let sh=t==='square'?'<rect x="25" y="15" width="90" height="90"/>':t==='para'?'<polygon points="45,18 130,18 105,100 20,100"/>':t==='rhombus'?'<polygon points="75,8 130,58 75,108 20,58"/>':'<polygon points="20,20 130,20 130,100 20,100"/><line x1="20" y1="20" x2="130" y2="100" stroke="#c99700" stroke-width="4"/>';return '<svg viewBox="0 0 150 120" width="150" height="120" role="img" aria-label="'+t+' shape"><g fill="#e7efff" stroke="#153b7a" stroke-width="3" stroke-linejoin="round">'+sh+'</g></svg>'}
function render(){const q=Q[i],s=S[i];$('tag').textContent=q[0];$('question').textContent=q[1];$('visual').innerHTML=visual(q[2]);$('options').innerHTML='';q[3].forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+v;b.disabled=s.correct||s.wrong.has(n);if(s.correct&&n===q[4])b.classList.add('correct');if(s.wrong.has(n))b.classList.add('wrong');b.onclick=()=>answer(n);$('options').appendChild(b)});let f=$('feedback');f.className='feedback'+(s.first?' show '+(s.correct?'good':'bad'):'');f.textContent=s.first?(s.correct?'Correct! '+q[6]:'Not quite — no point for the first attempt. Try again. '+q[6]):'';$('prev').disabled=i===0;$('next').disabled=!s.correct;$('next').textContent=i===Q.length-1?'Finish →':'Next →';$('bar').style.width=(i+1)/Q.length*100+'%';$('score').textContent=score+'/'+Q.length;$('streak').textContent=streak+' (best '+best+')';$('case').textContent=(i+1)+'/'+Q.length}
function answer(n){let s=S[i],q=Q[i];if(s.correct||s.wrong.has(n))return;if(!s.first){s.first=true;if(n===q[4]){score++;streak++;best=Math.max(best,streak);s.correct=true;beep(820,.15)}else{s.wrong.add(n);streak=0;beep(240,.18)}}else if(n===q[4]){s.correct=true;beep(720,.15)}else{s.wrong.add(n);beep(240,.18)}render()}
$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(!S[i].correct)return;if(i===Q.length-1){finish();return}i++;render()};$('hint').onclick=()=>{$('feedback').className='feedback show';$('feedback').textContent='💡 Hint: '+Q[i][5]};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';if(soundOn)beep(650)};$('volume').oninput=e=>{volume=Number(e.target.value)/100;$('volout').textContent=e.target.value+'%'};
function finish(){let pct=Math.round(score/Q.length*100);$('game').innerHTML='<div class="final"><div class="trophy">🏆 ✨</div><h2>Tessellation Studio complete!</h2><div class="big">'+score+' / '+Q.length+'</div><p>First-attempt score: '+pct+'%. Best streak: '+best+'. Retries are for learning and do not add points.</p><button class="btn primary" id="again">↻ Play again</button></div>';for(let n=0;n<80;n++){let p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#153b7a','#6b46a8','#c99700','#16844a'][n%4];p.style.animationDelay=Math.random()*.7+'s';$('confetti').appendChild(p)}setTimeout(()=>$('confetti').innerHTML='',3500);beep(520,.16);setTimeout(()=>beep(650,.16),180);setTimeout(()=>beep(800,.25),360);$('again').onclick=()=>location.reload()}render();
</script></body></html>

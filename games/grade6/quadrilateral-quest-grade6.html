<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quadrilateral Quest | Temmy Smart Games</title>
<style>
:root{--b:#153b7a;--p:#6b46a8;--g:#c99700;--ink:#172033;--pale:#f2f5fb;--green:#16794b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--pale);font-family:Arial,sans-serif;color:var(--ink);font-weight:700}.wrap{max-width:960px;margin:auto;padding:16px}.hero{background:linear-gradient(120deg,var(--b),#2859a5,var(--p));color:white;text-align:center;padding:18px;border-radius:20px}.brand{border:1px solid #ffffffa8;border-radius:25px;padding:7px 12px;font-size:12px;letter-spacing:1px}.hero h1{font-size:clamp(26px,5vw,40px);margin:12px 0 5px}.hero p{margin:0;font-weight:500}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:white;border:1px solid #dbe3f1;border-radius:25px;padding:9px 12px;font-size:14px}.sound{background:#17233d;color:white;border:0;font:inherit;cursor:pointer}.card{background:white;border-radius:20px;padding:clamp(15px,3vw,26px);box-shadow:0 8px 25px #1720330c}.progress{height:9px;background:#e5eaf4;border-radius:20px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:linear-gradient(90deg,var(--b),var(--p));transition:width .25s}.tag{display:inline-block;background:#efe8ff;color:#5c359c;border-radius:20px;padding:7px 11px;font-size:12px}.question{font-size:clamp(20px,3.2vw,28px);line-height:1.35;margin:12px 0}.diagram{min-height:120px;display:flex;align-items:center;justify-content:center;margin:8px 0 16px}.shape{width:140px;height:90px;background:#2859a5;border:3px solid var(--g);position:relative}.square{width:100px;height:100px}.para{clip-path:polygon(25% 0,100% 0,75% 100%,0 100%)}.trap{clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.rhombus{width:90px;height:90px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.kite{width:90px;height:110px;clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.opt{min-height:52px;border:2px solid #dbe3f1;background:white;border-radius:13px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.opt:disabled{cursor:default;opacity:1}.opt.correct{background:#e6f7ed;border-color:var(--green)}.opt.wrong{background:#fff0ef;border-color:var(--red);color:var(--red)}.feedback{display:none;margin-top:12px;padding:13px;border-radius:13px;line-height:1.45;background:#eef4ff}.feedback.show{display:block}.feedback.good{background:#e6f7ed}.feedback.bad{background:#fff0ef}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 15px;background:#e9edf6;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--b);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.push{flex:1}.final{text-align:center;padding:24px 8px}.trophy{font-size:60px;animation:bob 1s ease-in-out infinite alternate}.big{font-size:clamp(42px,8vw,64px);color:var(--b);margin:12px}@keyframes bob{to{transform:translateY(-7px) rotate(-3deg)}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti i{position:absolute;top:-15px;width:8px;height:14px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}footer{text-align:center;color:#657189;font-size:12px;padding:14px}@media(max-width:560px){.wrap{padding:9px}.hero{padding:14px 9px}.stats{gap:5px}.pill{font-size:12px;padding:8px 10px}.options{grid-template-columns:1fr}.push{display:none}}@media(max-height:650px){.wrap{padding-top:7px}.hero{padding:9px}.hero h1{margin:4px}.stats{margin:7px 0}.card{padding:13px}.diagram{min-height:70px;margin:3px}.shape{transform:scale(.75)}.question{margin:7px 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><header class="hero"><span class="brand">TEMMY SMART GAMES</span><h1>🔷 Quadrilateral Quest</h1><p>Grade 6 Mathematics · Unit 5: 2D Shapes</p></header>
<div class="stats"><span class="pill">⭐ Score: <b id="score">0/12</b></span><span class="pill">🔥 Streak: <b id="streak">0</b></span><span class="pill">🎯 Case: <b id="case">1/12</b></span><button class="pill sound" id="sound">🔊 Sound ON</button></div>
<section class="card" id="game"><div class="progress"><div class="bar" id="bar"></div></div><span class="tag" id="tag"></span><h2 class="question" id="question"></h2><div class="diagram" id="diagram"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="btn" id="prev">← Previous</button><button class="btn" id="hint">💡 Hint</button><span class="push"></span><button class="btn primary" id="next" disabled>Next →</button></div></section><footer>Temmy Smart Games · Learn • Play • Think • Achieve</footer></main><div class="confetti" id="confetti"></div>
<script>
const Q=[
["SHAPE RECOGNITION","Which quadrilateral has four equal sides and four right angles?","square",["Rectangle","Square","Rhombus","Trapezium"],1,"Think of the shape with equal sides and all angles measuring 90°.","A square has four equal sides and four right angles."],
["SHAPE RECOGNITION","Which shape has two pairs of parallel sides?","para",["A general trapezium","A parallelogram","A kite","An isosceles triangle"],1,"Look for a quadrilateral with both pairs of opposite sides parallel.","A parallelogram has two pairs of parallel sides."],
["CLASSIFYING SHAPES","In this textbook section, which quadrilateral has one pair of parallel sides?","trap",["Square","Rhombus","Trapezium","Parallelogram"],2,"It is the quadrilateral named in Section 5.1.","In this textbook, a trapezium has one pair of parallel sides."],
["SIDE PROPERTIES","Which shape has four equal sides but does not need four right angles?","rhombus",["Rhombus","Rectangle","Isosceles trapezium","Kite"],0,"A square is a special example of this shape.","A rhombus has four equal sides; its angles need not be 90°."],
["SIDE PROPERTIES","Which statement is true for every rectangle?","rect",["All four sides are equal","Opposite sides are equal and parallel","It has exactly one pair of parallel sides","It has no right angles"],1,"Think about the properties of opposite sides.","A rectangle has two pairs of equal, parallel opposite sides and four right angles."],
["SHAPE RECOGNITION","Which shape has two pairs of adjacent equal sides?","kite",["Kite","Parallelogram","Rectangle","Trapezium"],0,"Think of the quadrilateral named after something that flies in the wind.","A kite has two pairs of adjacent equal sides."],
["ANGLE PROPERTIES","At what angle do the sides of a square meet?","square",["45°","60°","90°","180°"],2,"A square has four right angles.","Each interior angle of a square is 90°."],
["DIAGONALS","Which statement about the diagonals of a rectangle is correct?","rectdiag",["They do not meet","They bisect each other","They are always perpendicular","Only one diagonal exists"],1,"The diagonals cut each other in half.","The diagonals of a rectangle bisect each other."],
["LINES OF SYMMETRY","How many lines of symmetry does a square have?","square",["1","2","3","4"],3,"Count the vertical, horizontal and two diagonal lines.","A square has four lines of symmetry."],
["COMPARE SHAPES","Which shape has diagonals that bisect each other at 90°?","rhombus",["Any trapezium","A rhombus","Any rectangle","An isosceles trapezium"],1,"Think of a quadrilateral with four equal sides.","The diagonals of a rhombus bisect each other at right angles."],
["REASONING","A quadrilateral has two pairs of parallel sides. What is its most general name?","para",["Kite","Parallelogram","Trapezium","Isosceles trapezium"],1,"Choose the family name for quadrilaterals with both pairs of opposite sides parallel.","A quadrilateral with two pairs of parallel sides is a parallelogram."],
["FINAL CHALLENGE","Which shape can be split along a diagonal into two triangles?","squarediag",["A square","A circle","A semicircle","A line segment"],0,"A diagonal joins opposite vertices of a polygon.","A diagonal of a square divides it into two triangles."]
];
let i=0,score=0,streak=0,best=0,soundOn=true;const S=Q.map(()=>({wrong:new Set(),correct:false,first:false}));
const $=id=>document.getElementById(id);
function beep(f=650,d=.12){if(!soundOn)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);o.onended=()=>c.close()}catch(e){}}
function draw(t){let d=$('diagram');d.innerHTML='';let s=document.createElement('div');s.className='shape';if(t==='square'||t==='squarediag')s.classList.add('square');if(t==='para')s.style.clipPath='polygon(25% 0,100% 0,75% 100%,0 100%)';if(t==='trap')s.style.clipPath='polygon(18% 0,82% 0,100% 100%,0 100%)';if(t==='rhombus')s.style.clipPath='polygon(50% 0,100% 50%,50% 100%,0 50%)';if(t==='kite')s.style.clipPath='polygon(50% 0,100% 38%,50% 100%,0 38%)';if(t==='rect'){s.style.width='150px';s.style.height='78px'}if(t==='rectdiag'||t==='squarediag'){s.style.backgroundImage='linear-gradient(34deg,transparent 49%,#c99700 49.5%,#c99700 51%,transparent 51.5%),linear-gradient(-34deg,transparent 49%,#c99700 49.5%,#c99700 51%,transparent 51.5%)';if(t==='rectdiag'){s.style.width='150px';s.style.height='78px'}}d.appendChild(s)}
function render(){let q=Q[i],st=S[i];$('tag').textContent=q[0];$('question').textContent=q[1];draw(q[2]);$('options').innerHTML='';q[3].forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+v;b.disabled=st.correct||st.wrong.has(n);if(st.correct&&n===q[4])b.classList.add('correct');if(st.wrong.has(n))b.classList.add('wrong');b.onclick=()=>answer(n);$('options').appendChild(b)});let f=$('feedback');f.className='feedback'+(st.first?' show '+(st.correct?'good':'bad'):'');f.textContent=st.first?(st.correct?'Correct! '+q[6]:'Not quite — no point for the first attempt. Try another option. '+q[6]):'';$('prev').disabled=i===0;$('next').disabled=!st.correct;$('next').textContent=i===Q.length-1?'Finish →':'Next →';$('bar').style.width=((i+1)/Q.length*100)+'%';$('score').textContent=score+'/'+Q.length;$('streak').textContent=streak+' (best '+best+')';$('case').textContent=(i+1)+'/'+Q.length}
function answer(n){let st=S[i],q=Q[i];if(st.correct||st.wrong.has(n))return;if(!st.first){st.first=true;if(n===q[4]){score++;streak++;best=Math.max(best,streak);st.correct=true;beep(850,.15)}else{st.wrong.add(n);streak=0;beep(230,.18)}}else if(n===q[4]){st.correct=true;beep(720,.15)}else{st.wrong.add(n);beep(230,.18)}render()}
$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(!S[i].correct)return;if(i===Q.length-1){finish();return}i++;render()};$('hint').onclick=()=>{$('feedback').className='feedback show';$('feedback').textContent='💡 Hint: '+Q[i][5]};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';if(soundOn)beep(660)};
function finish(){let pct=Math.round(score/Q.length*100);$('game').innerHTML='<div class="final"><div class="trophy">🏆 ✨</div><h2>Quadrilateral Quest complete!</h2><div class="big">'+score+' / '+Q.length+'</div><p>First-attempt score: '+pct+'%. Best streak: '+best+'. Retries are for learning and do not add points.</p><button class="btn primary" id="again">↻ Play again</button></div>';let c=$('confetti');for(let n=0;n<90;n++){let p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#153b7a','#6b46a8','#c99700','#16844a'][n%4];p.style.animationDelay=Math.random()*.7+'s';c.appendChild(p)}setTimeout(()=>c.innerHTML='',3500);beep(520,.18);setTimeout(()=>beep(660,.18),180);setTimeout(()=>beep(800,.28),360);$('again').onclick=()=>location.reload()}
render();
</script></body></html>

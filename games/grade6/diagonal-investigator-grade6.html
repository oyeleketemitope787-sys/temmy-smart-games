<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagonal Investigator | Temmy Smart Games</title>
<style>
:root{--b:#153b7a;--p:#6b46a8;--g:#c99700;--ink:#172033;--pale:#f2f5fb;--green:#16794b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--pale);font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-weight:700}.wrap{max-width:960px;margin:auto;padding:16px}.hero{background:linear-gradient(120deg,var(--b),#2859a5,var(--p));color:white;text-align:center;padding:18px;border-radius:20px}.brand{display:inline-block;border:1px solid #ffffffa8;border-radius:25px;padding:7px 12px;font-size:12px;letter-spacing:1px}.hero h1{font-size:clamp(26px,5vw,40px);margin:11px 0 5px}.hero p{margin:0;font-weight:500}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:white;border:1px solid #dbe3f1;border-radius:25px;padding:9px 12px;font-size:14px}.sound{background:#17233d;color:white;border:0;font:inherit;cursor:pointer}.card{background:white;border-radius:20px;padding:clamp(15px,3vw,26px);box-shadow:0 8px 25px #1720330c}.progress{height:9px;background:#e5eaf4;border-radius:20px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:linear-gradient(90deg,var(--b),var(--p));transition:width .25s}.tag{display:inline-block;background:#efe8ff;color:#5c359c;border-radius:20px;padding:7px 11px;font-size:12px}.question{font-size:clamp(20px,3.2vw,28px);line-height:1.35;margin:12px 0}.diagram{min-height:130px;display:flex;align-items:center;justify-content:center;margin:8px 0 16px}.shape{position:relative;width:150px;height:88px}.shape svg{display:block;width:100%;height:100%;overflow:visible}.shape .outline{fill:#e7efff;stroke:#153b7a;stroke-width:3;stroke-linejoin:round}.shape .diagonal{stroke:#c99700;stroke-width:3.5;stroke-linecap:round}.shape .right-angle{fill:none;stroke:#c99700;stroke-width:2}.shape .vertex{fill:#153b7a}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.opt{min-height:52px;border:2px solid #dbe3f1;background:white;border-radius:13px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}.opt:disabled{cursor:default;opacity:1}.opt.correct{background:#e6f7ed;border-color:var(--green)}.opt.wrong{background:#fff0ef;border-color:var(--red);color:var(--red)}.feedback{display:none;margin-top:12px;padding:13px;border-radius:13px;line-height:1.45;background:#eef4ff}.feedback.show{display:block}.feedback.good{background:#e6f7ed}.feedback.bad{background:#fff0ef}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 15px;background:#e9edf6;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--b);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.push{flex:1}.final{text-align:center;padding:24px 8px}.trophy{font-size:60px;animation:bob 1s ease-in-out infinite alternate}.big{font-size:clamp(42px,8vw,64px);color:var(--b);margin:12px}@keyframes bob{to{transform:translateY(-7px) rotate(-3deg)}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti i{position:absolute;top:-15px;width:8px;height:14px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}footer{text-align:center;color:#657189;font-size:12px;padding:14px}@media(max-width:560px){.wrap{padding:9px}.hero{padding:14px 9px}.stats{gap:5px}.pill{font-size:12px;padding:8px 10px}.options{grid-template-columns:1fr}.push{display:none}}@media(max-height:650px){.wrap{padding-top:7px}.hero{padding:9px}.hero h1{margin:4px}.stats{margin:7px 0}.card{padding:13px}.diagram{min-height:70px;margin:3px}.shape{transform:scale(.75)}.question{margin:7px 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><header class="hero"><span class="brand">TEMMY SMART GAMES</span><h1>📐 Diagonal Investigator</h1><p>Grade 6 Mathematics · Unit 5: 2D Shapes</p></header>
<div class="stats"><span class="pill">⭐ Score: <b id="score">0/12</b></span><span class="pill">🔥 Streak: <b id="streak">0</b></span><span class="pill">🔎 Case: <b id="case">1/12</b></span><button class="pill sound" id="sound" type="button">🔊 Sound ON</button></div>
<section class="card" id="game"><div class="progress"><div class="bar" id="bar"></div></div><span class="tag" id="tag"></span><h2 class="question" id="question"></h2><div class="diagram" id="diagram"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="btn" id="prev" type="button">← Previous</button><button class="btn" id="hint" type="button">💡 Hint</button><span class="push"></span><button class="btn primary" id="next" type="button" disabled>Next →</button></div></section><footer>Temmy Smart Games · Learn • Play • Think • Achieve</footer></main><div class="confetti" id="confetti"></div>
<script>
const Q=[
["DIAGONAL BASICS","What is a diagonal in a polygon?","square",["A line joining adjacent vertices","A line joining two non-adjacent vertices","A curved edge","A line around the outside"],1,"A diagonal connects vertices that are not next to each other.","A diagonal joins two non-adjacent vertices of a polygon."],
["RECTANGLE","What is true about the diagonals of a rectangle?","rect",["They are equal in length and bisect each other","They are always perpendicular","They are parallel","They do not cross"],0,"They meet at the centre and each is split into two equal parts.","The diagonals of a rectangle are equal in length and bisect each other."],
["SQUARE","Which statement describes the diagonals of a square?","square",["They are unequal and parallel","They are equal, bisect each other and meet at 90°","They never meet","Only one diagonal bisects the other"],1,"A square has the diagonal properties of a rectangle and a rhombus.","The diagonals of a square are equal, bisect each other at right angles."],
["PARALLELOGRAM","What is true about the diagonals of a general parallelogram?","para",["They always meet at 90°","They are always equal","They bisect each other","They are parallel"],2,"Each diagonal cuts the other into two equal parts.","The diagonals of a parallelogram bisect each other; they are not necessarily equal or perpendicular."],
["RHOMBUS","Which property do the diagonals of a rhombus have?","rhombus",["They bisect each other at 90°","They are always equal","They never cross","They are parallel"],0,"They meet at right angles and cut each other in half.","The diagonals of a rhombus bisect each other at 90°."],
["COMPARE","Which pair of shapes always has equal diagonals?","rect",["A rectangle and a square","A general parallelogram and a kite","A rhombus and a general parallelogram","A trapezium and a kite"],0,"Think of the shapes whose diagonals are equal as a standard property.","Rectangles and squares have equal diagonals."],
["REASONING","A quadrilateral has diagonals that bisect each other. Which conclusion is justified?","para",["It must be a kite","It is a parallelogram","It must have four right angles","It must have four equal sides"],1,"This property identifies a parallelogram family, but does not prove it is a square.","If a quadrilateral's diagonals bisect each other, it is a parallelogram."],
["RIGHT ANGLES","Which shape has diagonals that always meet at 90° and bisect each other?","rhombus",["A rectangle only","A rhombus","A general parallelogram","An isosceles trapezium"],1,"Look for the shape with four equal sides.","A rhombus has diagonals that bisect each other at right angles."],
["DIAGONAL LENGTH","Which statement is always true about the diagonals of a square?","square",["They have different lengths","They are equal in length","They are parallel","They do not bisect each other"],1,"A square is also a rectangle.","The diagonals of a square are equal in length."],
["KITE","Which statement describes the diagonals of a typical kite?","kite",["They are always equal","They are perpendicular, and one bisects the other","They are parallel","Both always bisect each other"],1,"The longer symmetry diagonal bisects the other diagonal at right angles.","For a standard kite, the diagonals are perpendicular and one diagonal bisects the other."],
["CHECK THE CLAIM","Mina says, 'Every parallelogram has equal diagonals.' Is she correct?","para",["Yes, every time","No; equal diagonals are guaranteed for rectangles, not every parallelogram","Yes, because all four sides are equal","No, parallelogram diagonals never bisect each other"],1,"A slanted parallelogram is a useful counterexample.","Mina is incorrect. A general parallelogram's diagonals bisect each other but need not be equal."],
["FINAL CHALLENGE","A quadrilateral's diagonals are equal, bisect each other and meet at 90°. Which listed shape fits all three properties?","square",["A general parallelogram","A square","A trapezium","A kite in every case"],1,"Check the diagonal properties of a square.","A square has equal diagonals that bisect each other at right angles."]
];
let i=0,score=0,streak=0,best=0,soundOn=true;const S=Q.map(()=>({wrong:new Set(),correct:false,first:false}));const $=id=>document.getElementById(id);
function beep(f=650,d=.12){if(!soundOn)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);o.onended=()=>c.close()}catch(e){}}
function draw(t){
 let d=$('diagram'); d.innerHTML='';
 const wrap=document.createElement('div'); wrap.className='shape';
 let pts, w=116, h=116, markers='';
 if(t==='square'){
   w=120;h=120;wrap.style.width='120px';wrap.style.height='120px';
   pts=[[20,20],[100,20],[100,100],[20,100]];
   markers='<path class="right-angle" d="M 60 60 L 69 60 L 69 69"/>';
 }else if(t==='rect'){
   w=170;h=100;wrap.style.width='170px';wrap.style.height='100px';
   pts=[[15,20],[155,20],[155,80],[15,80]];
 }else if(t==='para'){
   w=170;h=100;wrap.style.width='170px';wrap.style.height='100px';
   pts=[[45,15],[155,15],[125,85],[15,85]];
 }else if(t==='rhombus'){
   w=130;h=130;wrap.style.width='130px';wrap.style.height='130px';
   pts=[[65,10],[120,65],[65,120],[10,65]];
   markers='<path class="right-angle" d="M 65 65 L 75 65 L 75 75 L 65 75 Z"/>';
 }else if(t==='kite'){
   w=120;h=140;wrap.style.width='120px';wrap.style.height='140px';
   pts=[[60,8],[108,50],[60,132],[12,50]];
   markers='<path class="right-angle" d="M 60 50 L 69 50 L 69 59 L 60 59 Z"/>';
 }else{
   wrap.style.width='116px';wrap.style.height='116px';
   pts=[[20,20],[100,20],[100,100],[20,100]];
 }
 const polygon=pts.map(p=>p.join(',')).join(' ');
 const [a,b,c,e]=pts;
 const svg=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t} with diagonals joining opposite vertices"><polygon class="outline" points="${polygon}"/><line class="diagonal" x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}"/><line class="diagonal" x1="${b[0]}" y1="${b[1]}" x2="${e[0]}" y2="${e[1]}"/>${markers}${pts.map(v=>`<circle class="vertex" cx="${v[0]}" cy="${v[1]}" r="2.5"/>`).join('')}</svg>`;
 wrap.innerHTML=svg; d.appendChild(wrap);
}
function render(){let q=Q[i],st=S[i];$('tag').textContent=q[0];$('question').textContent=q[1];draw(q[2]);$('options').innerHTML='';q[3].forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+v;b.disabled=st.correct||st.wrong.has(n);if(st.correct&&n===q[4])b.classList.add('correct');if(st.wrong.has(n))b.classList.add('wrong');b.onclick=()=>answer(n);$('options').appendChild(b)});let f=$('feedback');f.className='feedback'+(st.first?' show '+(st.correct?'good':'bad'):'');f.textContent=st.first?(st.correct?'Correct! '+q[6]:'Not quite — no point for the first attempt. Try another option. '+q[6]):'';$('prev').disabled=i===0;$('next').disabled=!st.correct;$('next').textContent=i===Q.length-1?'Finish →':'Next →';$('bar').style.width=((i+1)/Q.length*100)+'%';$('score').textContent=score+'/'+Q.length;$('streak').textContent=streak+' (best '+best+')';$('case').textContent=(i+1)+'/'+Q.length}
function answer(n){let st=S[i],q=Q[i];if(st.correct||st.wrong.has(n))return;if(!st.first){st.first=true;if(n===q[4]){score++;streak++;best=Math.max(best,streak);st.correct=true;beep(850,.15)}else{st.wrong.add(n);streak=0;beep(230,.18)}}else if(n===q[4]){st.correct=true;beep(720,.15)}else{st.wrong.add(n);beep(230,.18)}render()}
$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(!S[i].correct)return;if(i===Q.length-1){finish();return}i++;render()};$('hint').onclick=()=>{$('feedback').className='feedback show';$('feedback').textContent='💡 Hint: '+Q[i][5]};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';if(soundOn)beep(660)};
function finish(){let pct=Math.round(score/Q.length*100);$('game').innerHTML='<div class="final"><div class="trophy">🏆 ✨</div><h2>Diagonal Investigator complete!</h2><div class="big">'+score+' / '+Q.length+'</div><p>First-attempt score: '+pct+'%. Best streak: '+best+'. Retries are for learning and do not add points.</p><button class="btn primary" id="again">↻ Play again</button></div>';let c=$('confetti');for(let n=0;n<90;n++){let p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#153b7a','#6b46a8','#c99700','#16844a'][n%4];p.style.animationDelay=Math.random()*.7+'s';c.appendChild(p)}setTimeout(()=>c.innerHTML='',3500);beep(520,.18);setTimeout(()=>beep(660,.18),180);setTimeout(()=>beep(800,.28),360);$('again').onclick=()=>location.reload()}
render();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quadrilateral Sorter | Temmy Smart Games</title>
<style>
:root{--blue:#153b7a;--purple:#6b46a8;--gold:#c99700;--ink:#182238;--pale:#f2f5fb;--line:#dce4f1;--green:#19734b;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-weight:700}.wrap{max-width:950px;margin:auto;padding:14px}.hero{padding:18px 14px;text-align:center;color:white;background:linear-gradient(120deg,var(--blue),#2859a5,var(--purple));border-radius:20px}.brand{display:inline-block;border:1px solid #ffffffa8;border-radius:30px;padding:7px 12px;font-size:12px;letter-spacing:1px}.hero h1{font-size:clamp(26px,5vw,40px);margin:10px 0 4px}.hero p{font-weight:500;margin:0}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.pill{background:white;border:1px solid var(--line);border-radius:25px;padding:9px 12px;font-size:14px}.sound{background:#17233d;color:white;font:inherit;cursor:pointer}.card{background:white;border-radius:20px;padding:clamp(15px,3vw,25px);box-shadow:0 8px 25px #1720330b}.progress{height:9px;background:#e5eaf4;border-radius:20px;overflow:hidden;margin-bottom:15px}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .25s}.tag{display:inline-block;padding:7px 11px;border-radius:20px;background:#efe8ff;color:#5c359c;font-size:12px}.question{font-size:clamp(20px,3.4vw,28px);line-height:1.35;margin:12px 0}.diagram{display:flex;align-items:center;justify-content:center;min-height:130px;margin:8px 0 15px}.shape svg{display:block;width:100%;height:100%}.shape .outline{fill:#e7efff;stroke:var(--blue);stroke-width:3;stroke-linejoin:round}.shape .vertex{fill:var(--blue)}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.opt{min-height:52px;border:2px solid var(--line);background:white;border-radius:13px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;line-height:1.35}.opt:disabled{opacity:1;cursor:default}.opt.correct{background:#e6f7ed;border-color:var(--green)}.opt.wrong{background:#fff0ef;border-color:var(--red);color:var(--red)}.feedback{display:none;margin-top:12px;padding:13px;border-radius:13px;line-height:1.45;background:#eef4ff}.feedback.show{display:block}.feedback.good{background:#e6f7ed}.feedback.bad{background:#fff0ef}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 15px;background:#e9edf6;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--blue);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.push{flex:1}.final{text-align:center;padding:24px 8px}.trophy{font-size:60px;animation:bob 1s ease-in-out infinite alternate}.big{font-size:clamp(42px,8vw,64px);color:var(--blue);margin:12px}@keyframes bob{to{transform:translateY(-7px) rotate(-3deg)}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti i{position:absolute;top:-15px;width:8px;height:14px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}footer{text-align:center;color:#657189;font-size:12px;padding:14px}@media(max-width:560px){.wrap{padding:9px}.hero{padding:14px 9px}.stats{gap:5px}.pill{font-size:12px;padding:8px 10px}.options{grid-template-columns:1fr}.push{display:none}}@media(max-height:650px){.wrap{padding-top:7px}.hero{padding:9px}.hero h1{margin:4px}.stats{margin:7px 0}.card{padding:13px}.diagram{min-height:70px;margin:3px}.question{margin:7px 0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap">
<header class="hero"><span class="brand">TEMMY SMART GAMES</span><h1>🔷 Quadrilateral Sorter</h1><p>Grade 6 Mathematics · Unit 5: 2D Shapes</p></header>
<div class="stats"><span class="pill">⭐ Score: <b id="score">0/12</b></span><span class="pill">🔥 Streak: <b id="streak">0 (best 0)</b></span><span class="pill">🗂️ Case: <b id="case">1/12</b></span><button class="pill sound" id="sound" type="button">🔊 Sound ON</button></div>
<section class="card" id="game"><div class="progress"><div class="bar" id="bar"></div></div><span class="tag" id="tag"></span><h2 class="question" id="question"></h2><div class="diagram" id="diagram"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="btn" id="prev" type="button">← Previous</button><button class="btn" id="hint" type="button">💡 Hint</button><span class="push"></span><button class="btn primary" id="next" type="button" disabled>Next →</button></div></section>
<footer>Temmy Smart Games · Learn • Play • Think • Achieve</footer></main><div class="confetti" id="confetti"></div>
<script>
const Q=[
["SHAPE IDENTIFICATION","Which quadrilateral has four equal sides and four right angles?","square",["Rectangle","Square","Rhombus","Kite"],1,"Look for a shape with both four equal sides and four right angles.","A square has four equal sides and four right angles."],
["PARALLEL SIDES","Which shape has two pairs of parallel sides?","para",["A trapezium with one pair of parallel sides","Parallelogram","Kite","Triangle"],1,"A parallelogram has both pairs of opposite sides parallel.","A parallelogram has two pairs of parallel sides."],
["FOUR EQUAL SIDES","A quadrilateral has four equal sides but its angles are not all 90°. Which shape best describes it?","rhombus",["Rectangle","Rhombus","Trapezium","Kite"],1,"It has four equal sides, but it is not a square.","A rhombus has four equal sides; its angles need not all be 90°."],
["RIGHT ANGLES","Which shape always has four right angles?","rect",["Rectangle","Rhombus","Kite","Trapezium"],0,"A square also has four right angles, but it is not one of the options.","A rectangle always has four right angles."],
["CLASSIFY BY PROPERTIES","Which statement is true about every square?","square",["Only one pair of sides is parallel","It has four equal sides and two pairs of parallel sides","It has no right angles","Its diagonals are parallel"],1,"A square also has four right angles.","A square has four equal sides, two pairs of parallel sides and four right angles."],
["REASONING","A shape has two pairs of parallel sides, but it does not have four right angles. Which shape could it be?","para",["A non-rectangular parallelogram","A square","A kite","A trapezium with only one pair of parallel sides"],0,"It belongs to the parallelogram family, but is not a rectangle or square.","A non-rectangular parallelogram has two pairs of parallel sides without four right angles."],
["ISOSCELES TRAPEZIUM","Which feature is characteristic of an isosceles trapezium?","trap",["It has four equal sides","Its non-parallel sides are equal in length","It has two pairs of parallel sides","All angles are 90°"],1,"The two sides that are not parallel have equal lengths.","An isosceles trapezium has equal non-parallel sides."],
["KITE","Which description best matches a kite?","kite",["Two pairs of adjacent equal sides","Four right angles and four equal sides","Exactly two pairs of parallel sides","Four unequal sides are required"],0,"Think of equal sides that meet at neighbouring vertices.","A kite has two pairs of equal adjacent sides."],
["COMPARE SHAPES","Which statement correctly compares a square and a rectangle?","square",["Neither has right angles","Both have four right angles; only a square must have four equal sides","A rectangle must have four equal sides","A square has only one pair of parallel sides"],1,"A square has all the properties of a rectangle, plus four equal sides.","Both have four right angles; a square also has four equal sides."],
["PARALLELOGRAM FAMILY","Which pair of properties is true for every parallelogram?","para",["Opposite sides are parallel and equal in length","All four sides are equal and all angles are 90°","Diagonals are always equal and perpendicular","Only one pair of sides is parallel"],0,"Compare the two pairs of opposite sides.","Every parallelogram has opposite sides parallel and equal in length."],
["CHECK THE CLAIM","Ravi says, 'Every rhombus is a square.' Is he correct?","rhombus",["Yes, because every rhombus has four right angles","No, a rhombus does not have to have four right angles","Yes, because its diagonals are equal","No, because a rhombus has only three sides"],1,"A rhombus has four equal sides, but its angles need not all be right angles.","Ravi is incorrect: a rhombus is not necessarily a square."],
["FINAL CHALLENGE","Which shape has one pair of parallel sides, following the terminology in this unit?","trap",["Square","Parallelogram","Trapezium","Rhombus"],2,"Check the unit's description of a trapezium.","In this unit's terminology, a trapezium has one pair of parallel sides."]
];
let i=0,score=0,streak=0,best=0,soundOn=true;const S=Q.map(()=>({wrong:new Set(),correct:false,first:false}));const $=id=>document.getElementById(id);
function beep(f=650,d=.12){if(!soundOn)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);o.onended=()=>c.close()}catch(e){}}
function draw(t){const d=$('diagram');d.innerHTML='';let pts,w=140,h=110;if(t==='square'){w=110;h=110;pts=[[20,20],[90,20],[90,90],[20,90]]}else if(t==='rect'){w=160;h=100;pts=[[15,20],[145,20],[145,80],[15,80]]}else if(t==='para'){w=160;h=100;pts=[[45,15],[145,15],[115,85],[15,85]]}else if(t==='rhombus'){w=130;h=130;pts=[[65,10],[120,65],[65,120],[10,65]]}else if(t==='trap'){w=150;h=110;pts=[[35,15],[115,15],[145,90],[5,90]]}else if(t==='kite'){w=120;h=140;pts=[[60,8],[105,50],[60,132],[15,50]]}const poly=pts.map(v=>v.join(',')).join(' ');const svg=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${t} quadrilateral"><polygon class="outline" points="${poly}"/>${pts.map(v=>`<circle class="vertex" cx="${v[0]}" cy="${v[1]}" r="2.5"/>`).join('')}</svg>`;const s=document.createElement('div');s.className='shape';s.style.width=w+'px';s.style.height=h+'px';s.innerHTML=svg;d.appendChild(s)}
function render(){const q=Q[i],st=S[i];$('tag').textContent=q[0];$('question').textContent=q[1];draw(q[2]);$('options').innerHTML='';q[3].forEach((v,n)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+v;b.disabled=st.correct||st.wrong.has(n);if(st.correct&&n===q[4])b.classList.add('correct');if(st.wrong.has(n))b.classList.add('wrong');b.onclick=()=>answer(n);$('options').appendChild(b)});const f=$('feedback');f.className='feedback'+(st.first?' show '+(st.correct?'good':'bad'):'');f.textContent=st.first?(st.correct?'Correct! '+q[6]:'Not quite — no point for the first attempt. Try another option. '+q[6]):'';$('prev').disabled=i===0;$('next').disabled=!st.correct;$('next').textContent=i===Q.length-1?'Finish →':'Next →';$('bar').style.width=((i+1)/Q.length*100)+'%';$('score').textContent=score+'/'+Q.length;$('streak').textContent=streak+' (best '+best+')';$('case').textContent=(i+1)+'/'+Q.length}
function answer(n){const st=S[i],q=Q[i];if(st.correct||st.wrong.has(n))return;if(!st.first){st.first=true;if(n===q[4]){score++;streak++;best=Math.max(best,streak);st.correct=true;beep(850,.15)}else{st.wrong.add(n);streak=0;beep(230,.18)}}else if(n===q[4]){st.correct=true;beep(720,.15)}else{st.wrong.add(n);beep(230,.18)}render()}
$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(!S[i].correct)return;if(i===Q.length-1){finish();return}i++;render()};$('hint').onclick=()=>{$('feedback').className='feedback show';$('feedback').textContent='💡 Hint: '+Q[i][5]};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';if(soundOn)beep(660)};
function finish(){const pct=Math.round(score/Q.length*100);$('game').innerHTML='<div class="final"><div class="trophy">🏆 ✨</div><h2>Quadrilateral Sorter complete!</h2><div class="big">'+score+' / '+Q.length+'</div><p>First-attempt score: '+pct+'%. Best streak: '+best+'. Retries are for learning and do not add points.</p><button class="btn primary" id="again">↻ Play again</button></div>';const c=$('confetti');for(let n=0;n<90;n++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#153b7a','#6b46a8','#c99700','#16844a'][n%4];p.style.animationDelay=Math.random()*.7+'s';c.appendChild(p)}setTimeout(()=>c.innerHTML='',3500);beep(520,.18);setTimeout(()=>beep(660,.18),180);setTimeout(()=>beep(800,.28),360);$('again').onclick=()=>location.reload()}
render();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Explorer — Temmy Smart Games</title>
<style>
:root{--blue:#153b7a;--gold:#c99700;--purple:#6546a8;--ink:#172238;--muted:#63708a;--bg:#f2f5fc;--line:#dce4f2;--green:#19734b;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:16px}
.hero{background:linear-gradient(115deg,var(--blue),#3156a0,var(--purple));color:white;text-align:center;border-radius:26px;padding:22px 16px;margin-bottom:12px}
.brand{display:inline-block;border:1px solid #ffffff9c;border-radius:30px;padding:5px 15px;font-size:.78rem;font-weight:850;letter-spacing:.08em}
h1{font-size:clamp(1.65rem,5vw,2.5rem);line-height:1.12;margin:10px 0 4px}.sub{margin:0;font-size:clamp(.95rem,3vw,1.15rem)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
.pill{background:white;border:1px solid var(--line);border-radius:30px;padding:9px 14px;font-weight:750}
.soundpill{background:#172238;color:white;border:0;cursor:pointer}
.card{background:white;border-radius:24px;padding:clamp(18px,4vw,30px);box-shadow:0 10px 28px #1c2f5510}
.progress{height:10px;border-radius:99px;background:#e5eaf4;overflow:hidden;margin-bottom:22px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .25s}
.tag{display:inline-block;background:#efe7ff;color:#5a3b92;border-radius:24px;padding:7px 13px;font-weight:850;font-size:.85rem;margin-bottom:10px}
h2{font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.3;margin:5px 0 18px}
.diagram{display:flex;justify-content:center;align-items:center;min-height:185px;margin:8px 0 18px}
.diagram svg{width:min(100%,330px);height:auto;max-height:260px}
.options{display:grid;grid-template-columns:1fr;gap:10px}
.option{display:block;width:100%;text-align:left;background:white;border:2px solid var(--line);border-radius:15px;padding:14px 16px;font:700 1rem/1.35 inherit;color:var(--ink);cursor:pointer;min-height:54px}
.option:hover:not(:disabled){border-color:#8da4d0;background:#f8faff}.option:disabled{cursor:default;opacity:1}
.option.correct{border-color:var(--green);background:#e7f7ee;color:#145c3d}.option.wrong{border-color:var(--red);background:#fff0ef;color:var(--red)}
.feedback{border-radius:14px;padding:13px 15px;margin-top:14px;background:#eef4ff;font-weight:650}.feedback.good{background:#e7f7ee;color:#145c3d}.feedback.bad{background:#fff0ef;color:#9e2018}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:800;font-size:1rem;cursor:pointer;background:#e9eef8;color:var(--blue)}.btn.primary{background:var(--blue);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{background:#fff8df;color:#765500;border-radius:12px;padding:12px;margin-top:12px}
.volume{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px auto 14px;font-weight:700}.volume input{width:min(240px,55vw);accent-color:var(--purple)}
.small{font-size:.9rem;color:var(--muted)}.end{text-align:center;padding:18px 0}.trophy{font-size:4rem}.scorebig{font-size:clamp(3rem,12vw,5rem);font-weight:900;color:var(--blue);margin:10px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.confetti i{position:absolute;top:-20px;width:9px;height:15px;animation:fall 2.4s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
@media(min-width:650px){.options{grid-template-columns:1fr 1fr}.wrap{padding:20px}.card{padding:30px}}
@media(max-height:720px){.hero{padding:13px}.card{padding:16px}.diagram{min-height:130px;margin:3px 0 10px}.diagram svg{max-height:180px}h2{margin-bottom:10px}.option{padding:10px 12px;min-height:46px}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="brand">TEMMY SMART GAMES</div><h1>⭕ Circle Explorer</h1><p class="sub">Grade 6 Mathematics · Unit 5.2: Circles</p></header>
<div class="stats"><div class="pill" id="scorePill">⭐ Score: 0/12</div><div class="pill" id="streakPill">🔥 Streak: 0 (best 0)</div><div class="pill" id="casePill">🔎 Question: 1/12</div><button class="pill soundpill" id="soundToggle" type="button">🔊 Sound ON</button></div>
<div class="volume"><label for="volume">🔉 Volume</label><input id="volume" type="range" min="0" max="100" value="65"><span id="volumeValue">65%</span></div>
<main class="card" id="gameCard"><div class="progress"><div class="bar" id="bar"></div></div><div id="playArea"></div></main>
<footer class="small" style="text-align:center;padding:18px 0">Temmy Smart Games · Learn • Play • Think • Achieve</footer>
</div><div class="confetti" id="confetti"></div>
<script>
const circleSVG=(kind='parts')=>{
 let s=`<svg viewBox="0 0 320 220" role="img" aria-label="Circle diagram"><circle cx="160" cy="110" r="78" fill="#edf2ff" stroke="#153b7a" stroke-width="4"/>`;
 if(kind==='parts'||kind==='diameter'||kind==='radius'){
   s+=`<circle cx="160" cy="110" r="4.5" fill="#c99700"/>`;
   if(kind!=='radius') s+=`<line x1="82" y1="110" x2="238" y2="110" stroke="#c99700" stroke-width="4"/><text x="160" y="96" text-anchor="middle" font-size="13" fill="#765500" font-weight="700">diameter</text>`;
   if(kind!=='diameter') s+=`<line x1="160" y1="110" x2="215" y2="55" stroke="#6546a8" stroke-width="4"/><text x="200" y="72" font-size="13" fill="#6546a8" font-weight="700">radius</text>`;
   s+=`<text x="168" y="128" font-size="13" fill="#172238" font-weight="700">centre</text>`;
 }
 if(kind==='chord') s+=`<line x1="100" y1="70" x2="220" y2="70" stroke="#c99700" stroke-width="5"/><text x="160" y="57" text-anchor="middle" font-size="14" fill="#765500" font-weight="700">chord</text>`;
 if(kind==='circumference') s+=`<circle cx="160" cy="110" r="78" fill="none" stroke="#c99700" stroke-width="7"/><text x="160" y="20" text-anchor="middle" font-size="13" fill="#765500" font-weight="700">circumference</text>`;
 return s+`</svg>`;
};
const questions=[
 {tag:'CIRCLE PARTS',q:'Which point is the centre of a circle?',visual:'parts',opts:['A point on the circumference','The point in the middle of the circle','The longest line around the circle','A point outside the circle'],a:1,why:'The centre is the point in the middle of the circle.'},
 {tag:'CIRCLE PARTS',q:'What is a radius?',visual:'radius',opts:['A line from the centre to the circumference','A line around the outside of a circle','A line joining two points outside the circle','The distance all the way around a circle'],a:0,why:'A radius goes from the centre to the circumference.'},
 {tag:'CIRCLE PARTS',q:'Which line is a diameter?',visual:'diameter',opts:['A line from the centre to the circumference','A line across the circle passing through its centre','Any line outside the circle','A curved part of the circumference'],a:1,why:'A diameter crosses the circle through the centre and joins two points on the circumference.'},
 {tag:'CIRCLE PARTS',q:'What is the circumference of a circle?',visual:'circumference',opts:['The point in the middle','The distance from centre to edge','The perimeter around the circle','Half of the diameter'],a:2,why:'The circumference is the perimeter around the circle.'},
 {tag:'RADIUS & DIAMETER',q:'A circle has a radius of 3 cm. What is its diameter?',visual:'radius',opts:['1.5 cm','3 cm','6 cm','9 cm'],a:2,why:'Diameter = 2 × radius, so 2 × 3 = 6 cm.'},
 {tag:'RADIUS & DIAMETER',q:'A circle has a diameter of 14 cm. What is its radius?',visual:'diameter',opts:['7 cm','14 cm','28 cm','12 cm'],a:0,why:'Radius = diameter ÷ 2, so 14 ÷ 2 = 7 cm.'},
 {tag:'MEASUREMENTS',q:'Which statement is true?',visual:'parts',opts:['A radius of 5 cm equals a diameter of 5 cm','A radius of 5 cm equals a diameter of 10 cm','A diameter is always half the radius','A radius is always longer than a diameter'],a:1,why:'The diameter is twice the radius: 2 × 5 = 10 cm.'},
 {tag:'MEASUREMENTS',q:'A radius is 70 mm. Which length is equivalent?',visual:'radius',opts:['0.7 cm','7 cm','70 cm','700 cm'],a:1,why:'10 mm = 1 cm, so 70 mm = 7 cm.'},
 {tag:'MEASUREMENTS',q:'A radius is 45 mm. Is this the same as a diameter of 9 cm?',visual:'diameter',opts:['Yes, because 45 mm doubled is 90 mm = 9 cm','Yes, because radius and diameter are equal','No, because 45 mm doubled is 45 mm','No, because 9 cm is 90 cm'],a:0,why:'Twice 45 mm is 90 mm, which is 9 cm.'},
 {tag:'APPLY YOUR KNOWLEDGE',q:'You draw a circle with a radius of 4.2 cm from point C. What does the circumference represent?',visual:'circumference',opts:['All points exactly 4.2 cm from C','Only points 4.2 cm above C','The point C itself','A straight line 4.2 cm long'],a:0,why:'The circle is the set of points exactly 4.2 cm from its centre C.'},
 {tag:'REASONING',q:'Learner A says a circle with radius 6 cm has a diameter of 12 cm. Learner B says its diameter is 3 cm. Who is correct?',visual:'diameter',opts:['Learner A','Learner B','Both learners','Neither learner'],a:0,why:'Diameter = 2 × radius, so the diameter is 12 cm.'},
 {tag:'REASONING',q:'A circle has a diameter of 80 mm. A learner says its radius is 4 cm. Is the learner correct?',visual:'parts',opts:['Yes: half of 80 mm is 40 mm = 4 cm','No: the radius is 80 mm','No: the radius is 160 mm','Yes: radius and diameter are equal'],a:0,why:'Half of 80 mm is 40 mm, and 40 mm = 4 cm.'}
];
let index=0,score=0,streak=0,best=0, soundOn=true, volume=.65;
const firstAttempt=Array(questions.length).fill(null), chosen=Array(questions.length).fill(null), hints=Array(questions.length).fill(false), retries=Array(questions.length).fill(false);
const area=document.getElementById('playArea');
function tone(freq=600,dur=.12,type='sine'){
 if(!soundOn||volume<=0)return;
 try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,volume*.18),ctx.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur+.02);osc.onended=()=>ctx.close()}catch(e){}
}
function updateStats(){document.getElementById('scorePill').textContent=`⭐ Score: ${score}/12`;document.getElementById('streakPill').textContent=`🔥 Streak: ${streak} (best ${best})`;document.getElementById('casePill').textContent=`🔎 Question: ${Math.min(index+1,12)}/12`;document.getElementById('bar').style.width=`${Math.min(index,12)/12*100}%`;}
function render(){
 updateStats();
 if(index>=questions.length){finish();return}
 const q=questions[index], saved=chosen[index];
 area.innerHTML=`<div class="tag">${q.tag}</div><h2>${q.q}</h2><div class="diagram">${circleSVG(q.visual)}</div><div class="options">${q.opts.map((o,i)=>`<button type="button" class="option ${saved!==null&&i===q.a?'correct':''} ${saved!==null&&i===saved&&saved!==q.a?'wrong':''}" data-i="${i}" ${saved!==null?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>
 ${saved!==null?`<div class="feedback ${saved===q.a?'good':'bad'}">${saved===q.a?'Correct!':'Not quite — no point for this first attempt.'} ${q.why}</div>`:''}
 ${hints[index]?`<div class="hint">💡 Hint: ${hintFor(index)}</div>`:''}
 <div class="controls"><button class="btn" id="prev" ${index===0?'disabled':''}>← Previous</button><button class="btn" id="hint">💡 Hint</button><span style="flex:1"></span><button class="btn primary" id="next" ${saved===null?'disabled':''}>${index===11?'Finish':'Next →'}</button></div>
 <p class="small">Choose an answer, then press Next when you are ready. Your first answer determines your score.</p>`;
 area.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i))));
 document.getElementById('prev').onclick=()=>{if(index>0){index--;render()}};
 document.getElementById('hint').onclick=()=>{hints[index]=true;render()};
 document.getElementById('next').onclick=()=>{if(chosen[index]!==null){index++;render()}};
}
function hintFor(i){return ['The centre is the middle point.','Think of the distance from the centre to the edge.','The diameter passes through the centre.','Think of the perimeter of a circle.','Double the radius.','Divide the diameter by two.','The diameter is twice the radius.','There are 10 millimetres in one centimetre.','Double 45 mm and convert to centimetres.','The circumference is the boundary of the circle.','Double the radius to find the diameter.','Find half of 80 mm, then convert to centimetres.'][i]}
function answer(i){
 if(chosen[index]!==null)return;
 const q=questions[index];chosen[index]=i;firstAttempt[index]=i;
 if(i===q.a){score++;streak++;best=Math.max(best,streak);tone(760,.13);setTimeout(()=>tone(980,.16),90)}else{streak=0;tone(230,.2,'triangle')}
 render();
}
function finish(){
 updateStats();document.getElementById('bar').style.width='100%';
 area.innerHTML=`<div class="end"><div class="trophy">🏆 ✨</div><h2>Circle Explorer complete!</h2><div class="scorebig">${score} / 12</div><h3>First-attempt score: ${Math.round(score/12*100)}%. Best streak: ${best}.</h3><p>Retries and review are for learning and do not add points.</p><button class="btn primary" id="again">↻ Play again</button><p class="small">Review the explanations and practise the circle vocabulary again.</p></div>`;
 celebrate();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.22),i*140));
 document.getElementById('again').onclick=()=>{index=0;score=0;streak=0;best=0;for(let i=0;i<12;i++){chosen[i]=null;firstAttempt[i]=null;hints[i]=false;retries[i]=false}document.getElementById('confetti').innerHTML='';render()};
}
function celebrate(){const c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<75;i++){let e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=['#153b7a','#c99700','#6546a8','#2ca56c','#ed6a5a'][i%5];e.style.animationDelay=Math.random()*.8+'s';e.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(e)}}
document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';if(soundOn)tone(700,.12)};
document.getElementById('volume').oninput=e=>{volume=Number(e.target.value)/100;document.getElementById('volumeValue').textContent=e.target.value+'%';if(volume>0)tone(700,.08)};
render();
</script></body></html>

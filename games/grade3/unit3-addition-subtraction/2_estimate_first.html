<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Temmy Smart Games — Estimate First</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#fbf7ff);color:#18243d}
header{background:linear-gradient(135deg,#153b7a,#4b2b82);color:#fff;text-align:center;padding:18px 14px}
.badge{display:inline-block;background:#c99700;padding:7px 14px;border-radius:20px;font-size:.8rem;font-weight:800}
h1{margin:9px 0 4px;font-size:clamp(1.8rem,6vw,2.7rem)}
.subtitle{margin:0;font-weight:700}
.wrap{max-width:900px;margin:auto;padding:16px 14px 35px}
.panel{background:#fff;border-radius:22px;padding:19px;margin-bottom:15px;box-shadow:0 10px 30px rgba(21,59,122,.10)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#f2f6ff;border-radius:14px;padding:9px;text-align:center;font-size:.85rem}
.stat b{display:block;color:#153b7a;font-size:1.18rem;margin-top:3px}
.progress{height:10px;background:#e7ebf3;border-radius:20px;margin-top:12px;overflow:hidden}
.bar{height:100%;width:0;background:#c99700;transition:.35s}
.stage{text-align:center;color:#4b2b82;font-weight:900;margin:13px 0}
h2{text-align:center;color:#153b7a}
.question{text-align:center;font-size:clamp(1.8rem,7vw,3.3rem);font-weight:900;margin:18px 0}
.step{background:#f7f8fc;border-radius:16px;padding:14px;margin:12px 0}
.step-title{font-weight:900;color:#4b2b82;margin-bottom:8px}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:650px;margin:auto}
button{border:0;border-radius:14px;padding:12px 15px;font-size:1rem;font-weight:800;cursor:pointer;background:#153b7a;color:white}
button.gold{background:#c99700}
button.soft{background:#eeeaf8;color:#4b2b82}
button:disabled{opacity:.45;cursor:not-allowed}
.feedback{text-align:center;min-height:45px;font-weight:800;margin:10px 0}
.explain{display:none;background:#f7f4ff;border-left:5px solid #4b2b82;border-radius:12px;padding:13px;line-height:1.5}
.center{text-align:center}
.hidden{display:none}
.pill{display:inline-block;background:#eef2ff;color:#153b7a;padding:6px 10px;border-radius:20px;font-size:.82rem;font-weight:800}
.mastery{font-size:4rem}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.choice-grid{grid-template-columns:1fr}.question{font-size:2.2rem}}
</style>
</head>
<body>
<header>
<div class="badge">TEMMY SMART GAMES • GRADE 3</div>
<h1>🎯 Estimate First</h1>
<p class="subtitle">Round • Estimate • Calculate • Check</p>
</header>

<div class="wrap">
<section class="panel">
<div class="stats">
<div class="stat">Score<b id="score">0</b></div>
<div class="stat">Streak<b id="streak">0</b></div>
<div class="stat">Accuracy<b id="accuracy">100%</b></div>
<div class="stat">Round<b id="round">1/7</b></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
</section>

<section class="panel" id="game">
<div class="stage" id="stage">STEP 1 • ROUND TO THE NEAREST 10</div>
<div class="pill" id="type">ADDITION</div>
<div class="question" id="question">215 + 67</div>

<div class="step" id="stepRound">
<div class="step-title">1️⃣ ROUND</div>
<div id="roundPrompt">Round each number to the nearest 10.</div>
<div class="choice-grid" id="roundChoices"></div>
</div>

<div class="step hidden" id="stepEstimate">
<div class="step-title">2️⃣ ESTIMATE</div>
<div id="estimatePrompt"></div>
<div class="choice-grid" id="estimateChoices"></div>
</div>

<div class="step hidden" id="stepExact">
<div class="step-title">3️⃣ CALCULATE</div>
<div id="exactPrompt"></div>
<div class="choice-grid" id="exactChoices"></div>
</div>

<div class="step hidden" id="stepCheck">
<div class="step-title">4️⃣ CHECK</div>
<div id="checkPrompt"></div>
<div class="choice-grid" id="checkChoices"></div>
</div>

<div class="feedback" id="feedback"></div>
<div class="explain" id="explain"></div>
<div class="center"><button id="next" class="gold" disabled>Next Challenge →</button></div>
</section>

<section class="panel center hidden" id="finish">
<div class="mastery">🏆</div>
<h2>ESTIMATE MASTER!</h2>
<p id="finalText"></p>
<button onclick="restart()">Play Again</button>
</section>
</div>

<script>
const qs=[
{a:215,b:67,op:"+",ra:220,rb:70,est:290,ans:282},
{a:372,b:58,op:"+",ra:370,rb:60,est:430,ans:430},
{a:148,b:136,op:"+",ra:150,rb:140,est:290,ans:284},
{a:472,b:267,op:"−",ra:470,rb:270,est:200,ans:205},
{a:178,b:25,op:"−",ra:180,rb:30,est:150,ans:153},
{a:683,b:548,op:"−",ra:680,rb:550,est:130,ans:135},
{a:439,b:326,op:"+",ra:440,rb:330,est:770,ans:765}
];
let i=0,score=0,streak=0,correct=0,totalSteps=0,rightSteps=0,stage=1,locked=false;

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function questionText(q){return `${q.a} ${q.op} ${q.b}`}
function updateStats(){
$("score").textContent=score;$("streak").textContent=streak;
$("accuracy").textContent=totalSteps?Math.round(rightSteps/totalSteps*100)+"%":"100%";
$("round").textContent=(i+1)+"/"+qs.length;
$("bar").style.width=((i/qs.length)*100)+"%";
}
function render(){
const q=qs[i];stage=1;locked=false;
$("question").textContent=questionText(q);
$("type").textContent=q.op==="+"?"ADDITION":"SUBTRACTION";
$("stage").textContent="STEP 1 • ROUND TO THE NEAREST 10";
$("roundChoices").innerHTML=shuffle([
`${q.ra} and ${q.rb}`,`${q.ra+10} and ${q.rb}`,`${q.ra} and ${q.rb+10}`,`${q.ra-10} and ${q.rb}`
]).map(v=>`<button onclick="pickRound(this,'${v}')">${v}</button>`).join("");
$("stepRound").classList.remove("hidden");$("stepEstimate").classList.add("hidden");
$("stepExact").classList.add("hidden");$("stepCheck").classList.add("hidden");
$("feedback").textContent="";$("explain").style.display="none";$("next").disabled=true;
updateStats();
}
function mark(ok,explanation){
totalSteps++;if(ok)rightSteps++;
if(ok){score+=5;streak++;$("feedback").textContent="✅ Correct!";$("feedback").style.color="#18794e";}
else{streak=0;$("feedback").textContent="🔎 Let's check that step carefully."; $("feedback").style.color="#b42318";}
$("explain").innerHTML=explanation;$("explain").style.display="block";updateStats();
}
function pickRound(btn,v){
if(locked)return;locked=true;
const q=qs[i],correctV=`${q.ra} and ${q.rb}`;
mark(v===correctV,`Round to the nearest 10: <b>${q.a} → ${q.ra}</b> and <b>${q.b} → ${q.rb}</b>.`);
$("stage").textContent="STEP 2 • ESTIMATE";
$("stepEstimate").classList.remove("hidden");
$("estimatePrompt").textContent=`Using ${q.ra} ${q.op} ${q.rb}, what is the estimate?`;
$("estimateChoices").innerHTML=shuffle([q.est,q.est+10,q.est-10,q.ans]).map(x=>`<button onclick="pickEstimate(this,${x})">${x}</button>`).join("");
}
function pickEstimate(btn,x){
if(btn.disabled)return;
document.querySelectorAll("#estimateChoices button").forEach(b=>b.disabled=true);
const q=qs[i];mark(x===q.est,`Estimate: <b>${q.ra} ${q.op} ${q.rb} = ${q.est}</b>. This gives us a rough idea of the exact answer.`);
$("stage").textContent="STEP 3 • CALCULATE";
$("stepExact").classList.remove("hidden");
$("exactPrompt").textContent=`Now calculate ${q.a} ${q.op} ${q.b}.`;
$("exactChoices").innerHTML=shuffle([q.ans,q.ans+10,q.ans-10,q.est]).map(x=>`<button onclick="pickExact(this,${x})">${x}</button>`).join("");
}
function pickExact(btn,x){
document.querySelectorAll("#exactChoices button").forEach(b=>b.disabled=true);
const q=qs[i];mark(x===q.ans,`Exact answer: <b>${q.a} ${q.op} ${q.b} = ${q.ans}</b>.`);
$("stage").textContent="STEP 4 • CHECK";
$("stepCheck").classList.remove("hidden");
$("checkPrompt").textContent=`Is ${q.ans} close to the estimate ${q.est}?`;
$("checkChoices").innerHTML=shuffle(["YES — it is close","NO — it is far away"]).map((x,n)=>`<button onclick="pickCheck(this,${n===0})">${x}</button>`).join("");
}
function pickCheck(btn,yes){
document.querySelectorAll("#checkChoices button").forEach(b=>b.disabled=true);
const q=qs[i];mark(yes,`Check: <b>${q.ans}</b> is close to <b>${q.est}</b>. Your estimate helps you decide whether the exact answer is sensible.`);
$("next").disabled=false;
if(i===qs.length-1)$("next").textContent="See My Result →";
}
$("next").onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};
function finish(){
$("game").classList.add("hidden");$("finish").classList.remove("hidden");$("bar").style.width="100%";
const acc=Math.round(rightSteps/totalSteps*100);
$("finalText").innerHTML=`You completed all 7 challenges using the full strategy:<br><br><b>ESTIMATE → CALCULATE → CHECK</b><br><br><b>${score} points</b> • ${acc}% step accuracy<br><br>${acc===100?"💎 PERFECT STRATEGIST!":acc>=85?"🥇 ESTIMATION CHAMPION!":"🌟 KEEP PRACTISING!"}`;
}
function restart(){i=0;score=0;streak=0;correct=0;totalSteps=0;rightSteps=0;$("game").classList.remove("hidden");$("finish").classList.add("hidden");$("next").textContent="Next Challenge →";render()}
render();
</script>
</body>
</html>

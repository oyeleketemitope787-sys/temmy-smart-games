<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temmy Smart Games — Grade 4 — Likelihood Detective</title>
<style>
:root{--b:#153B7A;--g:#C99700;--p:#5B3A9D;--teal:#0B8FA3;--ink:#17324D;--green:#16845B;--red:#C83E4D}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef5ff,#fbf8ff 55%,#fff9ea);color:var(--ink);min-height:100vh}
.wrap{max-width:920px;margin:auto;padding:18px 14px 40px}.top{background:var(--b);color:#fff;padding:14px 18px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;font-weight:900}.hero{text-align:center;padding:20px 8px}.tag{display:inline-block;background:var(--g);color:#fff;border-radius:99px;padding:7px 13px;font-size:12px;font-weight:900}.hero h1{font-size:clamp(30px,7vw,50px);color:var(--b);margin:10px 0 5px}.hero p{color:#61758a;margin:0}
.card{background:#fff;border:2px solid #e2e9f3;border-radius:24px;padding:20px;box-shadow:0 14px 35px #153b7a18}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f5f8fc;border-radius:15px;padding:10px;text-align:center}.stat b{display:block;color:var(--b);font-size:21px;white-space:nowrap}.stat span{font-size:11px;color:#718096;font-weight:800}
.progress{height:10px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:15px 0}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--p),var(--g));transition:.35s}
.case{text-align:center}.skill{display:inline-block;background:#efe7ff;color:var(--p);border-radius:99px;padding:7px 12px;font-weight:900;font-size:12px;margin-top:4px}.prompt{font-size:clamp(21px,4.5vw,30px);font-weight:900;line-height:1.4;color:var(--ink);margin:18px auto;max-width:780px}.scenario{background:linear-gradient(135deg,#f7fbff,#fffaf0);border:2px dashed #b9cbe0;border-radius:18px;padding:16px;font-size:17px;font-weight:700;margin:10px 0 18px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.answer{background:#fff;border:2px solid #dbe5ef;border-radius:16px;padding:15px;font-size:18px;font-weight:900;color:var(--b);cursor:pointer}.answer:hover{border-color:var(--p);transform:translateY(-2px)}.answer.good{background:#e8f8f0;border-color:var(--green);color:var(--green)}.answer.bad{background:#fff0f0;border-color:var(--red);color:var(--red)}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:15px;background:#f7f9fc;line-height:1.5}.feedback.show{display:block}.hint{display:none;background:#fff7d9;border-left:5px solid var(--g);margin-top:10px;padding:12px;border-radius:12px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer}.next{background:var(--b);color:#fff}.hintBtn{background:#eef3f9;color:var(--b)}#sound{background:#fff;color:var(--b);border:1px solid #dbe5ef;border-radius:99px}
.final{display:none;text-align:center;padding:30px}.final.show{display:block;animation:pop .6s ease}.big{font-size:62px;font-weight:900;color:var(--b);animation:pulse 1s infinite alternate}.celebrate{font-size:28px;font-weight:900;color:var(--p)}.stars{font-size:34px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.piece{position:absolute;top:-20px;width:9px;height:17px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
@media(max-width:650px){.top{font-size:12px}.stats{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:1fr}.card{padding:16px}}
</style></head>
<body><div class="wrap">
<div class="top"><span>TEMMY SMART GAMES</span><span>GRADE 4 • MATHEMATICS</span></div>
<section class="hero"><span class="tag">UNIT 4 • PROBABILITY • 4.1 LIKELIHOOD</span><h1>🔎 Likelihood Detective</h1><p>Read the situation • Choose the language of chance • Explain your thinking</p></section>
<section class="card" id="game">
<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
<div class="stats" style="flex:1">
<div class="stat"><b id="level">1</b><span>🏁 LEVEL</span></div>
<div class="stat"><b id="score">0/10</b><span>⭐ SCORE</span></div>
<div class="stat"><b id="streak">0</b><span>🔥 STREAK</span></div>
<div class="stat"><b id="round">1/10</b><span>CASE</span></div>
</div>
<button id="sound">🔊 Sound ON</button></div>
<div class="progress"><div id="bar"></div></div>
<div class="case"><div class="skill" id="skill"></div><div class="prompt" id="prompt"></div><div class="scenario" id="scenario"></div><div class="answers" id="answers"></div>
<div class="controls"><button class="hintBtn" id="hintBtn">💡 Hint</button><button class="next" id="next" style="display:none">NEXT CASE →</button></div>
<div class="feedback" id="feedback"></div><div class="hint" id="hint"></div></div></section>
<section class="card final" id="final"><div class="stars" id="stars">⭐ ⭐ ⭐</div><div class="celebrate" id="celebrate"></div><div class="big" id="finalScore"></div><p id="finalText"></p><button class="next" onclick="location.reload()">🔄 PLAY AGAIN</button></section>
<div id="confetti" class="confetti"></div></div>
<script>
const Q=[{"skill": "Certain", "scenario": "The sun will rise tomorrow.", "options": ["Poor chance", "Even chance", "Good chance", "Certain"], "answer": 3, "explanation": "The resource treats this as a certain event in the everyday context: the sun will rise tomorrow.", "hint": "Ask yourself: is this expected to happen for sure?"}, {"skill": "No chance", "scenario": "You drop a cake and it flies upwards.", "options": ["No chance", "Likely", "Even chance", "Good chance"], "answer": 0, "explanation": "The resource uses this as an example of an event that will not happen.", "hint": "Can this event happen naturally in the situation described?"}, {"skill": "Even chance", "scenario": "A fair coin is flipped once. What is the chance of getting heads?", "options": ["There is an even chance.", "There is no chance.", "It is certain.", "There is a good chance."], "answer": 0, "explanation": "A fair coin has two equally possible outcomes: heads and tails.", "hint": "There are two equally likely outcomes."}, {"skill": "Poor chance", "scenario": "A standard die is rolled once. What is the likelihood of rolling a 5?", "options": ["Poor chance", "Certain", "Good chance", "No chance"], "answer": 0, "explanation": "Rolling a 5 is possible, but the other five numbers can also occur, so the resource describes it as a poor chance.", "hint": "It is possible, but is it likely compared with all the other numbers?"}, {"skill": "Good chance", "scenario": "A bag contains 8 red sweets and 2 blue sweets. One sweet is taken without looking. Which colour has a good chance?", "options": ["Red", "Blue", "Neither colour", "Both equally"], "answer": 0, "explanation": "There are many more red sweets than blue sweets, so red has the greater likelihood.", "hint": "Compare the number of red sweets with blue sweets."}, {"skill": "No chance", "scenario": "A spinner has only red, blue and yellow sections. What is the chance of landing on green?", "options": ["No chance", "Poor chance", "Even chance", "Good chance"], "answer": 0, "explanation": "Green is not on the spinner, so the event cannot happen.", "hint": "Look at the colours that actually appear on the spinner."}, {"skill": "Likely", "scenario": "A jar contains 9 yellow sweets and 1 blue sweet. Which statement best describes taking a yellow sweet?", "options": ["It is likely.", "It has no chance.", "It is an even chance.", "It is impossible."], "answer": 0, "explanation": "Yellow is much more common in the jar, so taking yellow is likely.", "hint": "Compare 9 yellow sweets with 1 blue sweet."}, {"skill": "Maybe", "scenario": "Which phrase best matches an event that could happen but might not happen?", "options": ["Maybe", "Certain", "No chance", "It will not happen"], "answer": 0, "explanation": "“Maybe” is one of the chance words used in the resource for an event that may happen.", "hint": "Choose the word that means it could happen, but is not certain."}, {"skill": "Good chance", "scenario": "A spinner has 4 equal red sections and 1 equal blue section. Which colour has a good chance of being selected?", "options": ["Red", "Blue", "Both equally", "Neither"], "answer": 0, "explanation": "Red occupies more of the spinner, so red is more likely.", "hint": "Which colour occupies more sections?"}, {"skill": "Likelihood order", "scenario": "Which list goes from least likely to most likely?", "options": ["No chance → Poor chance → Even chance → Good chance → Certain", "Certain → Good chance → Even chance → Poor chance → No chance", "Poor chance → No chance → Even chance → Certain → Good chance", "Even chance → Poor chance → Good chance → No chance → Certain"], "answer": 0, "explanation": "The chance language forms a scale from impossible/no chance through possible outcomes to certain.", "hint": "Start with an event that cannot happen and finish with an event that must happen."}];
let i=0,score=0,streak=0,attempts=0,firstWrong=false,locked=false,soundOn=true;
const $=x=>document.getElementById(x);
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function tone(f,d=.12){if(!soundOn)return;try{let C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function updateLevel(){
 let level= i < 3 ? 1 : i < 6 ? 2 : i < 8 ? 3 : 4;
 $("level").textContent=level;
}
function render(){let q=Q[i];locked=false;firstWrong=false;updateLevel();$("round").textContent=(i+1)+"/"+Q.length;$("skill").textContent=q.skill;$("prompt").textContent="Choose the best description of the chance.";$("scenario").innerHTML=q.scenario;$("score").textContent=score+"/"+Q.length;$("streak").textContent=streak;$("bar").style.width=(i/Q.length*100)+"%";$("feedback").className="feedback";$("hint").style.display="none";$("next").style.display="none";let box=$("answers");box.innerHTML="";shuffle(q.options.map((x,idx)=>({x,idx}))).forEach(o=>{let b=document.createElement("button");b.className="answer";b.textContent=o.x;b.onclick=()=>choose(b,o.idx);box.appendChild(b)})}
function choose(btn,idx){if(locked)return;attempts++;let q=Q[i];if(idx===q.answer){btn.classList.add("good");locked=true;if(!firstWrong){score++;streak++}else{streak=0}$("score").textContent=score+"/"+Q.length;$("streak").textContent=streak;[...$("answers").children].forEach(b=>b.disabled=true);$("feedback").innerHTML="<b>✅ Correct!</b><br>"+q.explanation;$("feedback").className="feedback show";$("next").style.display="inline-block";tone(720);setTimeout(()=>tone(960,.15),100)}else{btn.classList.add("bad");btn.disabled=true;firstWrong=true;streak=0;$("streak").textContent=0;$("feedback").innerHTML="<b>❌ Not quite.</b> Try another choice. A retry helps you learn, but does not add an Actual Score point.";$("feedback").className="feedback show";tone(190,.15)}}
$("next").onclick=()=>{i++;i<Q.length?render():finish()};
$("hintBtn").onclick=()=>{let hints=["Think about whether the event can happen every time, never, or somewhere in between.","If the event cannot happen, think about 'no chance'.","A fair coin has two equally possible outcomes.","A single number on a die is possible but not the most common outcome.","Compare how many red and blue sweets there are.","If the colour is not on the spinner, it cannot happen.","Look at which colour has more items.","Use the word that means it may happen, but is not certain.","Compare the number of equal sections for each colour.","Put the chance words on a scale from impossible to certain."];$("hint").textContent="💡 "+hints[i];$("hint").style.display="block"};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";if(soundOn)tone(600)};
function finish(){ $("game").style.display="none";$("final").className="card final show";let pct=Math.round(score/Q.length*100);$("finalScore").textContent=score+" / "+Q.length;$("finalText").innerHTML="Actual Score: <b>"+score+" / "+Q.length+"</b><br>Accuracy: <b>"+pct+"%</b><br>First-attempt correct = 1 point. Wrong first attempt = 0 points. Retries are for learning only.";if(pct===100){$("celebrate").textContent="🏆 LIKELIHOOD MASTER! PERFECT SCORE!";$("stars").textContent="⭐ ⭐ ⭐ ⭐ ⭐";confetti();tone(650,.18);setTimeout(()=>tone(850,.18),120);setTimeout(()=>tone(1050,.24),240)}else if(pct>=80){$("celebrate").textContent="🌟 Excellent Chance Reasoning!";$("stars").textContent="⭐ ⭐ ⭐ ⭐";confetti()}else if(pct>=60){$("celebrate").textContent="👏 Good Work — Keep Thinking About Chance!";$("stars").textContent="⭐ ⭐ ⭐"}else{$("celebrate").textContent="💪 Keep Practising the Language of Chance!";$("stars").textContent="⭐ ⭐"}}
function confetti(){let box=$("confetti");box.innerHTML="";for(let n=0;n<80;n++){let p=document.createElement("div");p.className="piece";p.style.left=Math.random()*100+"%";p.style.animationDelay=Math.random()*.7+"s";p.style.background=["#153B7A","#C99700","#5B3A9D","#0B8FA3","#16845B"][n%5];box.appendChild(p)}}
render();
</script></body></html>

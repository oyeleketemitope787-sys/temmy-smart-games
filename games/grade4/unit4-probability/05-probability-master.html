<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏆 Probability Master</title><style>
:root{--b:#153B7A;--g:#C99700;--p:#5B3A9D;--t:#0B8FA3;--gr:#16845B;--r:#C83E4D}*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#eef5ff,#fff9ea);color:#17324D}.wrap{max-width:900px;margin:auto;padding:18px}.top{background:var(--b);color:#fff;padding:14px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;font-weight:900}.hero{text-align:center;padding:20px}.tag{background:var(--g);color:#fff;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:900}.hero h1{font-size:clamp(30px,7vw,48px);color:var(--b);margin:12px 0 5px}.hero p{color:#61758a}
.card{background:#fff;border:2px solid #e2e9f3;border-radius:24px;padding:20px;box-shadow:0 14px 35px #153b7a18}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f5f8fc;border-radius:15px;padding:10px;text-align:center}.stat b{display:block;color:var(--b);font-size:21px}.stat span{font-size:11px;color:#718096;font-weight:800}.progress{height:10px;background:#e8edf4;border-radius:99px;margin:15px 0;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--t),var(--p),var(--g));width:0}
.prompt{font-size:clamp(21px,4.5vw,30px);font-weight:900;line-height:1.4;text-align:center;margin:18px 0}.note{background:#f8fbff;border:2px dashed #b9cbe0;border-radius:18px;padding:14px;text-align:center;font-weight:700;margin-bottom:16px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.answer{background:#fff;border:2px solid #dbe5ef;border-radius:16px;padding:15px;font-size:18px;font-weight:900;color:var(--b);cursor:pointer}.good{background:#e8f8f0!important;border-color:var(--gr)!important;color:var(--gr)!important}.bad{background:#fff0f0!important;border-color:var(--r)!important;color:var(--r)!important}.feedback,.hint{display:none;margin-top:14px;padding:14px;border-radius:15px;background:#f7f9fc}.hint{background:#fff7d9;border-left:5px solid var(--g)}.controls{text-align:center;margin-top:15px}button{border:0;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer;margin:4px}.next{background:var(--b);color:#fff}.hintbtn{background:#eef3f9;color:var(--b)}#sound{background:#fff;border:1px solid #dbe5ef;border-radius:99px}.final{display:none;text-align:center}.final.show{display:block}.big{font-size:60px;font-weight:900;color:var(--b)}.celebrate{font-size:28px;color:var(--p);font-weight:900}.conf{position:fixed;top:-20px;width:9px;height:17px;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><span>TEMMY SMART GAMES</span><span>GRADE 4 • MATHEMATICS</span></div>
<section class="hero"><span class="tag">UNIT 4 • PROBABILITY • FINAL CHALLENGE</span><h1>🏆 Probability Master</h1><p>Likelihood • spinners • coins • dice • experiments</p></section><section class="card" id="game">
<div style="display:flex;gap:8px;align-items:center">
<div class="stats" style="flex:1">
<div class="stat"><b id="level">1</b><span>🏁 LEVEL</span></div>
<div class="stat"><b id="score">0/10</b><span>⭐ SCORE</span></div>
<div class="stat"><b id="streak">0</b><span>🔥 STREAK</span></div>
<div class="stat"><b id="round">1/10</b><span>ROUND</span></div>
</div><button id="sound">🔊 Sound ON</button></div>
<div class="progress"><div id="bar"></div></div><div class="prompt" id="prompt"></div><div class="note">💡 REMEMBER</div><div class="answers" id="answers"></div><div class="controls"><button class="hintbtn" id="hint">💡 Hint</button><button class="next" id="next" style="display:none">10EXT →</button></div><div class="feedback" id="fb"></div><div class="hint" id="hb"></div></section>
<section class="card final" id="final"><div>⭐ ⭐ ⭐ ⭐ ⭐</div><div class="celebrate" id="celebrate"></div><div class="big" id="finalScore"></div><p id="finalText"></p><button class="next" onclick="location.reload()">PLAY AGAI10</button></section><div id="conf"></div></div>
<script>
const Q=[{"p": "Which event is certain?", "o": ["The sun will go down today.", "A dropped cake will fly upwards.", "You will find a four-leaf clover.", "A die will show 7."], "a": 0, "e": "The resource uses the sun going down as an example of a certain event.", "h": "Choose the event expected to happen for sure."}, {"p": "Which event has no chance?", "o": ["A standard die landing on 7", "A fair coin landing on heads", "A spinner landing on one of its colours", "A die landing on 5"], "a": 0, "e": "7 is not an outcome of a standard die.", "h": "Find the impossible event."}, {"p": "A fair coin is flipped once. What is the chance of heads?", "o": ["Even chance", "Certain", "No chance", "Poor chance"], "a": 0, "e": "Heads and tails are equally possible.", "h": "There are two equally likely outcomes."}, {"p": "A die is rolled once. Which event has a poor chance?", "o": ["Rolling a 5", "Rolling a number from 1 to 6", "Rolling a 7", "Rolling any possible number"], "a": 0, "e": "Rolling 5 is possible but is one outcome among six.", "h": "It must be possible but not certain."}, {"p": "A bag has 8 red sweets and 2 blue sweets. Which is more likely?", "o": ["Red", "Blue", "They are equal", "Neither"], "a": 0, "e": "There are more red sweets, so red is more likely.", "h": "Compare the quantities."}, {"p": "A spinner has equal red, blue and green sections. Which colour is more likely?", "o": ["They have the same chance", "Red", "Blue", "Green"], "a": 0, "e": "Equal sections mean equal chances.", "h": "Compare section sizes."}, {"p": "Which is the best way to investigate chance?", "o": ["Carry out an experiment, record outcomes and describe results", "Guess once and stop", "Ignore the results", "Only record a favourite outcome"], "a": 0, "e": "The resource asks learners to conduct experiments and present and describe results.", "h": "Think: experiment → record → describe."}, {"p": "Which sequence moves from least likely to most likely?", "o": ["No chance → Poor chance → Even chance → Good chance → Certain", "Certain → Good chance → Even chance → Poor chance → No chance", "Even chance → No chance → Certain → Poor chance → Good chance", "Poor chance → Certain → No chance → Good chance → Even chance"], "a": 0, "e": "The sequence moves from impossible to increasingly likely and finally certain.", "h": "Start with impossible and finish with must happen."}, {"p": "A die is rolled 50 times. Which information is useful when describing the experiment?", "o": ["How many times each number occurred", "The colour of the classroom", "The name of the die", "The size of the table"], "a": 0, "e": "The resource models recording how often each outcome occurs.", "h": "Record the outcomes of the trials."}, {"p": "After an experiment, why should you discuss the results?", "o": ["To describe what happened using the language of chance", "To guarantee the next result", "To change the outcomes", "To remove unusual results"], "a": 0, "e": "The resource asks learners to present and describe experimental results using probability language.", "h": "Think about explaining what the experiment showed."}];let i=0,score=0,streak=0,attempts=0,wrong=false,locked=false,soundOn=true;$=x=>document.getElementById(x);
function sh(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function tone(f,d=.12){if(!soundOn)return;try{let c=new(AudioContext||webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d)}catch(e){}}
function updateLevel(){
 let level=i<3?1:i<6?2:i<8?3:4;
 $("level").textContent=level;
}
function render(){let q=Q[i];wrong=false;locked=false;updateLevel();$("round").textContent=(i+1)+"/"+Q.length;$("score").textContent=score+"/"+Q.length;$("streak").textContent=streak;$("bar").style.width=i/Q.length*100+"%";$("prompt").innerHTML=q.p;$("fb").style.display="none";$("hb").style.display="none";$("next").style.display="none";let A=$("answers");A.innerHTML="";sh(q.o.map((x,n)=>({x,n}))).forEach(z=>{let b=document.createElement("button");b.class10ame="answer";b.textContent=z.x;b.onclick=()=>pick(b,z.n);A.appendChild(b)})}
function pick(b,n){if(locked)return;attempts++;let q=Q[i];if(n===q.a){b.classList.add("good");locked=true;if(!wrong){score++;streak++}else streak=0;$("score").textContent=score+"/"+Q.length;$("streak").textContent=streak;[...$("answers").children].forEach(x=>x.disabled=true);$("fb").innerHTML="<b>✅ Correct!</b><br>"+q.e;$("fb").style.display="block";$("next").style.display="inline-block";tone(720);setTimeout(()=>tone(960,.15),100)}else{b.classList.add("bad");b.disabled=true;wrong=true;streak=0;$("streak").textContent=0;$("fb").innerHTML="<b>❌ Try again.</b> A retry helps learning but does not add an Actual Score point.";$("fb").style.display="block";tone(190,.15)}}
$("next").onclick=()=>{i++;i<Q.length?render():finish()};$("hint").onclick=()=>{$("hb").textContent="💡 "+Q[i].h;$("hb").style.display="block"};$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound O10":"🔇 Sound OFF";if(soundOn)tone(600)};
function finish(){let p=Math.round(score/Q.length*100);$("game").style.display="none";$("final").class10ame="card final show";$("finalScore").textContent=score+" / "+Q.length;$("finalText").innerHTML="Actual Score: <b>"+score+" / "+Q.length+"</b><br>Accuracy: <b>"+p+"%</b><br>First-attempt correct = 1 point. Wrong first attempt = 0 points. Retries are for learning only.";if(p===100){$("celebrate").textContent="🏆 PERFECT!";conf()}else if(p>=80){$("celebrate").textContent="🌟 Excellent!";conf()}else if(p>=60)$("celebrate").textContent="👏 Good Work!";else $("celebrate").textContent="💪 Keep Practising!"}
function conf(){let c=$("conf");for(let n=0;n<70;n++){let x=document.createElement("i");x.class10ame="conf";x.style.left=Math.random()*100+"%";x.style.background=["#153B7A","#C99700","#5B3A9D","#0B8FA3","#16845B"][n%5];x.style.animationDelay=Math.random()+"s";c.appendChild(x)}}render();
</script></body></html>
